<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 335" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Diagrama de bloques del parking: ultrasonidos y LDR entran al Arduino, que decide y mueve el servo de la barrera, la luz y el LED RGB.</title><rect width="880" height="335" fill="white"/><text x="30" y="34" font-size="18" fill="#2c6046" text-anchor="start" font-weight="bold">El diagrama de bloques del parking con barrera</text><rect x="30" y="70" width="200" height="70" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="130.0" y="101.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor</text><text x="130.0" y="119.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">ultrasonidos (D7, D8)</text><rect x="30" y="170" width="200" height="70" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="130.0" y="201.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor</text><text x="130.0" y="219.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">LDR (A1)</text><rect x="320" y="110" width="210" height="90" rx="10" fill="#eef5f0" stroke="#2c6046" stroke-width="2.5"/><text x="425.0" y="142.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Arduino</text><text x="425.0" y="160.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">si coche &lt; 20 cm: sube</text><text x="425.0" y="178.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">si oscuro: luz</text><rect x="620" y="60" width="230" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="735.0" y="86.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Servo (A3)</text><text x="735.0" y="104.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">barrera</text><rect x="620" y="140" width="230" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="735.0" y="166.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">LED rojo (D12)</text><text x="735.0" y="184.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">luz del parking</text><rect x="620" y="220" width="230" height="60" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="735.0" y="246.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">LED RGB (D9, D10, D11)</text><text x="735.0" y="264.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">verde / rojo</text><line x1="230" y1="105" x2="320" y2="140" stroke="#d9822b" stroke-width="2.5"/><polygon points="320,140 308.0,140.3 311.4,131.6" fill="#d9822b"/><line x1="230" y1="205" x2="320" y2="175" stroke="#d9822b" stroke-width="2.5"/><polygon points="320,175 311.0,182.9 308.0,174.1" fill="#d9822b"/><line x1="530" y1="140" x2="620" y2="90" stroke="#263c4a" stroke-width="2.5"/><polygon points="620,90 612.6,99.5 608.1,91.3" fill="#263c4a"/><line x1="530" y1="155" x2="620" y2="170" stroke="#263c4a" stroke-width="2.5"/><polygon points="620,170 608.3,172.8 609.9,163.6" fill="#263c4a"/><line x1="530" y1="170" x2="620" y2="250" stroke="#263c4a" stroke-width="2.5"/><polygon points="620,250 608.6,246.1 614.8,239.2" fill="#263c4a"/><text x="30" y="320" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Entradas a la izquierda, decisión en el centro, salidas a la derecha; cada bloque con su pin.</text></svg>