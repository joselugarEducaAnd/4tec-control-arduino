<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Tablero Kanban con tres columnas: por hacer, haciendo y hecho, y tarjetas de tareas del proyecto.</title><rect width="880" height="345" fill="white"/><text x="30" y="34" font-size="18" fill="#2c6046" text-anchor="start" font-weight="bold">Un tablero Kanban: cada tarjeta es una tarea con su responsable</text><rect x="30" y="55" width="260" height="250" rx="10" fill="#eef5f0" stroke="#2c6046" stroke-width="2"/><text x="160" y="82" font-size="17" fill="#2c6046" text-anchor="middle" font-weight="bold">Por hacer</text><rect x="45" y="100" width="230" height="48" rx="6" fill="#fffbe6" stroke="#d9822b" stroke-width="2"/><text x="160" y="130" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">Montar el sensor (A.)</text><rect x="45" y="162" width="230" height="48" rx="6" fill="#fffbe6" stroke="#d9822b" stroke-width="2"/><text x="160" y="192" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">Probar el servo (M.)</text><rect x="310" y="55" width="260" height="250" rx="10" fill="#eef5f0" stroke="#2c6046" stroke-width="2"/><text x="440" y="82" font-size="17" fill="#2c6046" text-anchor="middle" font-weight="bold">Haciendo</text><rect x="325" y="100" width="230" height="48" rx="6" fill="#fffbe6" stroke="#d9822b" stroke-width="2"/><text x="440" y="130" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">Gemelo en Tinkercad (L.)</text><rect x="590" y="55" width="260" height="250" rx="10" fill="#eef5f0" stroke="#2c6046" stroke-width="2"/><text x="720" y="82" font-size="17" fill="#2c6046" text-anchor="middle" font-weight="bold">Hecho</text><rect x="605" y="100" width="230" height="48" rx="6" fill="#fffbe6" stroke="#d9822b" stroke-width="2"/><text x="720" y="130" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">Diagrama de bloques (A.)</text><rect x="605" y="162" width="230" height="48" rx="6" fill="#fffbe6" stroke="#d9822b" stroke-width="2"/><text x="720" y="192" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">Tabla de pines (M.)</text><text x="30" y="330" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">Las tarjetas se mueven de izquierda a derecha. Las iniciales dicen quién se encarga.</text></svg>