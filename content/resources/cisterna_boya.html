.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* la tarjeta aprovecha el ancho (hasta 1100 px) sin que el dibujo sea más alto que la ventana */
.iso-page{margin-top:28px;width:min(1100px,100% - 32px,max(680px,(100vh - 64px) * 900 / 560 + 48px));width:min(1100px,100% - 32px,max(680px,(100svh - 64px) * 900 / 560 + 48px))}
.iso-plate.cs-plate{padding-bottom:20px}
.cs-plate .iso-plate-corner{font-size:13px}
.cs-plate .iso-plate-corner[data-corner="title"]{color:var(--anatomy-text)}
/* pie: lectura y gráfica; debajo, la pista y los mandos */
.cs-pie{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,350px);grid-template-areas:"lectura graf" "izq izq";align-items:start;gap:14px 26px;margin:10px -4px 0}
.cs-lectura{grid-area:lectura;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.cs-l{display:block;font-size:19px;line-height:1.36;font-weight:500}
.cs-l b{font-weight:750}
.cs-estado{font-size:38px;line-height:1.1;font-weight:800;letter-spacing:.005em;margin-bottom:4px;color:var(--anatomy-strong)}
.cs-nivel::before,.cs-consigna::before,.cs-valv::before,.cs-caudal::before,.cs-rebose::before{content:"";display:inline-block;width:.62em;height:.62em;margin-right:.42em;border-radius:2px;vertical-align:.06em}
.cs-nivel::before{background:#1f5fd6}
.cs-consigna::before{background:#c25a00}
.cs-valv::before{background:#1d7a4f}
.cs-caudal::before{background:#0b4f9c;border-radius:50%}
.cs-rebose::before{background:#00727d;border-radius:50%}
.cs-tiempo{padding-left:1.04em}
.cs-valv-v{display:inline-block;padding:0 .32em;border-radius:5px;border:1.5px solid}
.cs-valv-v[data-valvula="abierta"],.cs-valv-v[data-valvula="casi cerrada"]{color:#0b3f80;background:#e3ecfa;border-color:#0b4f9c}
.cs-valv-v[data-valvula="cerrada"]{color:#1f2433;background:#e6e8ec;border-color:#3d4250}
.cs-rebose-v[data-rebose="1"]{color:#00535b;background:#dff3f4;border-radius:5px;padding:0 .3em;border:1.5px solid #00727d}
.cs-ritmo{color:#3d3d42;padding-left:1.04em}
.cs-graf{grid-area:graf;display:flex;flex-direction:column;gap:4px}
.cs-graf-t{font-family:var(--anatomy-mono);font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#46464b}
.cs-grafica{display:block;width:100%;height:auto;max-width:350px}
.cs-g-fondo{fill:#f5f7fa;stroke:#3d4250;stroke-width:1.2px}
.cs-g-rejilla{stroke:#d3d8e0;stroke-width:1px;fill:none}
.cs-g-consigna{fill:none;stroke:#c25a00;stroke-width:2px;stroke-dasharray:6 4}
.cs-g-consigna-t{font:700 13px/1 ui-sans-serif,system-ui,sans-serif;fill:#8a3d00!important}
.cs-g-ant{fill:none;stroke:#8d93a0;stroke-width:2.2px;stroke-linejoin:round}
.cs-g-traza{fill:none;stroke:#1f5fd6;stroke-width:3px;stroke-linejoin:round}
.cs-g-rebose{fill:none;stroke:#00727d;stroke-width:2.4px;stroke-dasharray:5 3.4}
.cs-grafica text.cs-g-rebose-t{font-size:13px;font-weight:700;fill:#00535b}
.cs-g-punto{fill:#1f5fd6;stroke:#fbfbfa;stroke-width:1.2px}
.cs-grafica text{font:600 14px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2433}
.cs-grafica text.cs-g-ant-t{font-weight:600;font-size:13px;fill:#4a4f5a}
.cs-izq{grid-area:izq;display:flex;flex-direction:column;gap:8px}
.cs-pista{font-family:var(--anatomy-mono);font-size:14.5px;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:#46464b;margin-top:4px}
/* mandos: botones táctiles de 44 × 44 como mínimo; en el PC llevan su tecla */
.cs-mandos{display:flex;flex-wrap:wrap;gap:8px;touch-action:manipulation}
.cs-boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:44px;min-height:44px;margin:0;padding:6px 13px 6px 8px;font:600 15px/1.2 var(--anatomy-mono);letter-spacing:.03em;color:var(--anatomy-strong);background:var(--anatomy-card);border:1.5px solid var(--anatomy-strong);border-radius:7px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.cs-boton kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;font:700 12.5px/1 var(--anatomy-mono);letter-spacing:0;border:1.2px solid currentColor;border-radius:4px}
.cs-boton[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.cs-boton.cs-descarga{border-color:#c2183b;border-width:2px;color:#8a0f28}
.cs-boton.cs-modo{border-color:#7a3aa8;border-width:2px;color:#5a2a7f}
.cs-boton:active{transform:translateY(1px)}
.cs-boton:focus-visible{outline:3px solid #0f8a63;outline-offset:2px}
.cs-salir{position:absolute;top:10px;right:16px;z-index:2}
.cs-salir[hidden]{display:none}
@media (hover:hover) and (pointer:fine){.cs-boton:hover{background:#ececea}.cs-boton[aria-pressed="true"]:hover{background:#3a3f4d}.cs-boton.cs-descarga:hover{background:#fdecef}.cs-boton.cs-modo:hover{background:#f5eefa}}
@media (hover:none){.cs-teclas,.cs-boton kbd{display:none}.cs-boton{padding:6px 14px}}
.cs-stage:focus{outline:none}
.cs-stage:focus-visible{outline:1.5px dashed var(--anatomy-mid);outline-offset:6px}
/* leyenda y pie de figura */
.iso-figure .iso-legend{font-size:16.5px;line-height:1.55;color:#3d3d42;gap:12px}
.cs-leyenda{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.cs-ley-t{font-weight:700;color:var(--anatomy-strong)}
.cs-ley-k{display:inline-flex;align-items:center;gap:8px}
.cs-muestra{width:30px;height:20px;flex:none}
@media (max-width:760px){
  .cs-pie{grid-template-columns:minmax(0,1fr);grid-template-areas:"lectura" "graf" "izq"}
}
@media (max-width:560px){
  .cs-l{font-size:15.5px}
  .cs-estado{font-size:28px}
  .cs-pista,.cs-graf-t{font-size:12.5px}
  .cs-boton{font-size:14px}
  .cs-mandos{gap:6px}
  .iso-figure .iso-legend{font-size:15px}
  .cs-plate .iso-plate-corner{font-size:11px}
  .cs-plate .iso-plate-corner[data-corner="title"]{left:0;right:0;letter-spacing:.06em;white-space:normal;line-height:1.25}
}
/* Maximizar: la tarjeta ocupa toda la pantalla (Fullscreen API) o toda la ventana;
   el dibujo toma todo el ancho que puede y la lectura pasa a un panel al lado (debajo en vertical) */
html.cs-max-abierto,html.cs-max-abierto body{overflow:hidden}
.iso-plate.cs-max{--cs-panel:clamp(330px,28vw,500px);position:fixed;inset:0;z-index:1000;width:auto;height:100vh;height:100dvh;max-width:none;margin:0;padding:46px 24px 14px;display:grid;grid-template-columns:minmax(0,calc((100vh - 60px) * 900 / 560)) var(--cs-panel);grid-template-columns:minmax(0,calc((100dvh - 60px) * 900 / 560)) var(--cs-panel);justify-content:center;grid-template-rows:minmax(0,1fr);column-gap:22px;box-shadow:none;overflow:hidden;background:var(--anatomy-card)}
.iso-plate.cs-max:fullscreen{width:100%;height:100%}
.iso-plate.cs-max:-webkit-full-screen{width:100%;height:100%}
.cs-max .iso-plate-corners{inset:16px 20px}
.cs-max .iso-plate-corner{font-size:15px}
.cs-max .iso-plate-corner[data-corner="title"]{right:auto;left:0}
.cs-max .cs-stage{grid-area:1/1;min-height:0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.cs-max .cs-stage .iso-svg{width:100%;height:100%;max-height:100%;max-width:100%;margin:0}
.cs-max .cs-pie{grid-area:1/2;display:flex;flex-direction:column;justify-content:center;gap:10px;margin:0;min-height:0;overflow:auto}
.cs-max .cs-pie{justify-content:safe center}
.cs-max .cs-pie>*{flex:none}
.cs-max .cs-grafica{max-width:min(100%,350px)}
.cs-max .cs-l{font-size:max(19px,calc(var(--cs-panel) / 24))}
.cs-max .cs-l.cs-estado{font-size:max(38px,calc(var(--cs-panel) / 11))}
.cs-max .cs-pista{font-size:14.5px}
.cs-max .cs-boton[data-mando="maximizar"]{display:none}
.cs-max .cs-nombres text{font-size:18px}
.cs-max .cs-una text{font-size:18.5px}
@media (orientation:portrait){
  .iso-plate.cs-max{grid-template-columns:minmax(0,1fr);justify-content:stretch;grid-template-rows:auto minmax(0,1fr);row-gap:12px;align-content:start}
  .cs-max .cs-stage{height:auto}
  .cs-max .cs-pie{grid-area:2/1;display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,350px);grid-template-areas:"lectura graf" "izq izq";align-items:start;gap:10px 22px;justify-content:stretch}
  .cs-max .cs-l{font-size:max(19px,min(2.3vw,26px))}
  .cs-max .cs-l.cs-estado{font-size:max(38px,min(4.6vw,52px))}
}

el botón pequeño (salen 3 litros)" aria-keyshortcuts="H"><kbd aria-hidden="true">H</kbd><span data-texto>Media descarga</span></button><button type="button" class="cs-boton cs-modo" data-mando="boya" aria-label="Quitar la boya: la válvula se abre 30 segundos con un reloj, sin mirar el nivel (lazo abierto)" aria-keyshortcuts="B"><kbd aria-hidden="true">B</kbd><span data-texto>Quitar la boya (lazo abierto)</span></button></div><div class="cs-mandos" role="group" aria-label="Mandos de la figura"><button type="button" class="cs-boton" data-mando="lazo" aria-label="Ver el lazo: el diagrama de bloques sobre la cisterna" aria-pressed="false" aria-keyshortcuts="L"><kbd aria-hidden="true">L</kbd><span data-texto>Ver el lazo</span></button><button type="button" class="cs-boton" data-mando="pausa" aria-label="Pausa: parar el tiempo" aria-pressed="false" aria-keyshortcuts="Space"><kbd aria-hidden="true">Espacio</kbd><span data-texto>Pausa</span></button><button type="button" class="cs-boton" data-mando="lento" aria-label="Ir lento: ver la cisterna 4 veces más despacio" aria-pressed="false" aria-keyshortcuts="S"><kbd aria-hidden="true">S</kbd><span data-texto>Ir lento</span></button><button type="button" class="cs-boton" data-mando="nombres" aria-label="Ver los nombres de las piezas" aria-pressed="false" aria-keyshortcuts="N"><kbd aria-hidden="true">N</kbd><span data-texto>Ver nombres</span></button><button type="button" class="cs-boton" data-mando="maximizar" aria-label="Maximizar: ver la figura a pantalla completa" aria-pressed="false" aria-keyshortcuts="M"><kbd aria-hidden="true">M</kbd><span data-texto>Maximizar</span></button></div></div></div><button type="button" class="cs-boton cs-salir" data-mando="salir" hidden aria-label="Salir de pantalla completa" aria-keyshortcuts="Escape M"><kbd aria-hidden="true">Esc</kbd><span data-texto>Salir</span></button></div><figcaption class="iso-legend"><span class="cs-leyenda"><span class="cs-ley-t">Colores del lazo:</span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#fff1e2" stroke="#c25a00" stroke-width="1.5"/></svg><span><b style="color:#c25a00">naranja</b>: consigna (marca del nivel lleno y tornillo de ajuste)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#e2f1e8" stroke="#1d7a4f" stroke-width="1.5"/></svg><span><b style="color:#1d7a4f">verde</b>: controlador y actuador (válvula de llenado)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#f1e6f8" stroke="#7a3aa8" stroke-width="1.5"/></svg><span><b style="color:#7a3aa8">morado</b>: sensor (boya) y realimentación (brazo)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#fde3e8" stroke="#c2183b" stroke-width="1.5"/></svg><span><b style="color:#c2183b">rojo</b>: perturbación (la descarga: pulsador y tapón)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#e9edf2" stroke="#4d5566" stroke-width="1.5"/></svg><span><b style="color:#4d5566">gris</b>: proceso (el tanque)</span></span></span><span class="cs-leyenda"><span class="cs-ley-t">Agua:</span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><path d="M3 10H21" fill="none" stroke="#0b4f9c" stroke-width="2.6"/><path d="M28 10 19 5.2V14.8Z" fill="#0b4f9c"/></svg><span>entra de la red</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#b8d6f4" stroke="#1f5fd6" stroke-width="1.5"/></svg><span>agua del tanque (su nivel es la salida)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><path d="M3 10H21" fill="none" stroke="#c2183b" stroke-width="2.6"/><path d="M28 10 19 5.2V14.8Z" fill="#c2183b"/></svg><span>sale al inodoro (descarga)</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><path d="M3 10H21" fill="none" stroke="#00727d" stroke-width="2.6" stroke-dasharray="4 3"/><path d="M28 10 19 5.2V14.8Z" fill="#00727d"/></svg><span>se va por el rebosadero</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#0b4f9c" stroke="#0b4f9c" stroke-width="1.5"/></svg><span>obturador abierto</span></span><span class="cs-ley-k"><svg class="cs-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#3d4250" stroke="#3d4250" stroke-width="1.5"/></svg><span>obturador cerrado</span></span></span><span class="iso-caption">Cisterna baja de pulsador doble sin la pared delantera y con solo la tira de atrás de la tapa. Es un sistema en lazo cerrado mecánico: la consigna es el nivel lleno (la marca naranja, que se fija con el tornillo de ajuste del brazo); el sensor es la boya, que sube y baja con el agua; la válvula de llenado es a la vez el controlador y el actuador: el brazo (la realimentación) hace bajar su obturador y cierra el paso del agua cuando la boya llega arriba. Es lazo cerrado porque la boya mide el nivel del agua, que es lo que la válvula cambia. Cuanto más abajo está la boya, más se abre la válvula: el caudal de entrada es 0,40 L/s × (6,0 L − nivel) / 6,0 L, y la válvula se cierra cuando faltan menos de 0,05 L. La descarga es la perturbación: el tapón sube 4 s y salen 6,0 L (o 3,0 L con media descarga); como la válvula ya empieza a llenar mientras tanto, se cierra a los 74 s de pulsar la descarga completa y a los 63 s de pulsar la media (desde vacía tardaría 72 s, cada vez más despacio). «Sin boya» es el lazo abierto: un reloj abre la válvula 30 s a 0,20 L/s (6,0 L) sin mirar el nivel: tras una descarga completa acierta, pero tras una media entran 3,0 L de más, que se van por el rebosadero. Lo que manda en el lazo abierto es el reloj, no el nivel. Valores ilustrativos de una cisterna doméstica; el tiempo de la animación va 8 veces más deprisa (los segundos de la lectura y la gráfica son los de la cisterna). Simplificaciones: el agua que queda por debajo del asiento de la descarga no se cuenta en los litros; la boca del rebosadero está justo a la altura del nivel lleno (en una cisterna real queda un poco más arriba), el temporizador «sin boya» no existe en las cisternas: está para comparar, y la válvula de llenado está dibujada algo más grande que en la realidad para que se vea su obturador.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])

        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;

  const arcPoints = (i, u, from, to) => {

  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;

    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));

  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;

      out.to -= TAU;

        for (const key of ["from", "to"]) {

    levels[0].groups.get(tone).forEach((arc, index) => {

      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));

    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

      let score = -Infinity;

        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {

      } else {

    for (const entry of above) {
      if (entry.used) continue;

      for (let at = 1; at <= run.length; at++) {

        if (at < run.length) strip(tone, run[at - 1], run[at]);

      }

  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);

      const mid = levelOf(i, (a.u + b.u) / 2);

        return;

      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    midS.push(Math.sin(t));

    const dr = meridian[i + 1][1] - meridian[i][1];

    const toneRow = [];

      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {

        const edge = along(s, r, arc);

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

  let outline;

  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;

    fillPath = surface.fill;
    outline = surface.outline;

    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);

      const keepLast = rims === "last" || rims === "ends";

        const same = a.ring === b.ring;

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {

  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));

  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));

  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));

    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };

function prismOf(F, polygon, s0, s1, P) {

    const prev = (j - 1 + n) % n;

    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];

}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));

const disc = (s0, s1, r, F, P, options = {}) =>

    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>

      [s0, rOut],

function solidOf(profile, F, P, options = {}) {

  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });

function bandOfProfile(profile, F, P, options = {}) {

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>

    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {

  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));

    const b = stops[index + 1];

    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };

    const span = [Math.max(s0, from), Math.min(s1, to)];

    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });

    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {

  const uV = dot3(F.u, V);

    const c = (least * norm + slope * aV) / flat;

  }

  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;

      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)

        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);

      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));

}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));

}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);

    paths: disc(from - stroke, to, r, F, P, options),

    stroke,

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);

  return out;
}

function facingOf(F, angle, P, slope = 0) {

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));

  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {

  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));

function cut(points, from, to) {
  const out = [];

  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];

      if (!out.length) out.push(lerp3(a, b, t0));

const M = (() => {// Modelo puro de la cisterna (valores ilustrativos de una cisterna doméstica): todo lo que la figura
// mueve, colorea o escribe sale de aquí. Vocabulario de la unidad «Control con Arduino»: consigna,
// sensor, controlador, actuador, realimentación, lazo abierto y lazo cerrado.
// Volúmenes en L, caudales en L/s y tiempos en s (del modelo, no de la animación).

const CAPACIDAD = 6.0; // hasta el nivel lleno (la consigna)
const DESCARGAS = { completa: 6.0, media: 3.0 }; // litros que salen al pulsar
const T_DESCARGA = 4; // s que el tapón está levantado
const QMAX = 0.4; // L/s con la válvula abierta del todo (la boya abajo del todo)
const CIERRE = 0.05; // con la boya: si faltan menos de 0,05 L, la válvula se cierra
const TAU = CAPACIDAD / QMAX; // 15 s
const Q_RELOJ = 0.2; // sin boya: caudal fijo
const T_RELOJ = 30; // sin boya: tiempo que el reloj deja abierta la válvula
const ACELERA = 8; // la animación va 8 veces más deprisa que la cisterna real
const ACELERA_LENTO = 2; // «Ir lento»: 2 veces más deprisa (4 veces más despacio que lo normal)
const H = 1 / 200; // paso de integración (s del modelo)
const PASOS_DESCARGA = Math.round(T_DESCARGA / H);
const PASOS_RELOJ = Math.round(T_RELOJ / H);
const CADA = 50; // un punto de la gráfica cada 0,25 s

// caudal de entrada con la boya: proporcional a lo que baja la boya (a lo que falta para el nivel lleno)
const caudalBoya = (V) => (CAPACIDAD - V < CIERRE ? 0 : (QMAX * (CAPACIDAD - V)) / CAPACIDAD);
// tiempo que tarda en cerrarse la válvula (con boya) desde un volumen V0, sin descarga
const tiempoLlenado = (V0) => (CAPACIDAD - V0 < CIERRE ? 0 : TAU * Math.log((CAPACIDAD - V0) / CIERRE));

function inicial(modo = "boya") {
  return { modo, V: CAPACIDAD, n: 0, pulsado: false, descarga: null, reloj: 0, rebosado: 0, salido: 0, traza: [], anterior: null };
}

// caudal de entrada en este momento
const caudal = (s) => (s.modo === "boya" ? caudalBoya(s.V) : s.reloj > 0 ? Q_RELOJ : 0);
// caudal que sale por el tapón (la descarga)
const caudalDescarga = (s) => (s.descarga ? s.descarga.D / T_DESCARGA : 0);
// apertura del obturador (0 cerrado, 1 abierto del todo): la misma cuenta que el caudal
const apertura = (s) => caudal(s) / QMAX;
// ¿se está saliendo el agua por el rebosadero ahora mismo?
const rebosando = (s) => s.V >= CAPACIDAD - 1e-9 && caudal(s) > caudalDescarga(s) + 1e-12;
// ¿pasa algo todavía?
const enMarcha = (s) => Boolean(s.descarga) || caudal(s) > 0;
// segundos desde la última descarga
const tiempo = (s) => s.n * H;
// lo que hace la válvula de llenado
function valvula(s) {
  const a = apertura(s);
  if (a <= 0) return "cerrada";
  if (s.modo === "boya" && a < 0.1) return "casi cerrada";
  return "abierta";
}
// lo que está pasando (el rótulo grande de la lectura)
function estadoDe(s) {
  if (s.descarga) return "Descargando";
  if (rebosando(s)) return "Se sale por el rebosadero";
  if (caudal(s) > 0) return "Llenando";
  if (s.modo === "reloj" && s.pulsado) return s.V >= CAPACIDAD - 1e-9 ? "Lleno: el reloj cerró la válvula" : "El reloj cerró la válvula";
  return "Lleno: la válvula está cerrada";
}

// pulsar: empieza una descarga (la perturbación). Sin boya, el reloj abre la válvula 30 s.
function pulsar(s, tipo) {
  if (s.traza.length) s.anterior = { modo: s.trazaModo ?? s.modo, tipo: s.trazaTipo, puntos: s.traza, rebosado: s.rebosado };
  s.descarga = { tipo, D: DESCARGAS[tipo], k: 0 };
  s.n = 0;
  s.pulsado = true;
  s.rebosado = 0;
  s.salido = 0;
  s.trazaModo = s.modo;
  s.trazaTipo = tipo;
  s.traza = [[0, s.V, 0]];
  if (s.modo === "reloj") s.reloj = PASOS_RELOJ;

    if (f.t === "caja") return A.box([f.x0, -f.u1, f.z0], [f.x1, -f.u0, f.z1], meta);
    if (f.t === "prisma") return A.prism(ZF, f.loop, f.z0, f.z1, meta);
    if (f.t === "cil") return A.disc(f.F, f.s0, f.s1, f.r, meta);
    return A.ball(f.c, f.r, meta);
  }
  // puntos (mundo) de la parte de la pieza que queda por encima de la altura z
  function puntosEncima(f, z) {
    if (f.t === "caja" || f.t === "prisma") {
      if (f.z1 <= z) return [];
      const z0 = Math.max(f.z0, z);
      const loop = loopDe(f);
      return [...loop.map(([u, x]) => W(u, z0, x)), ...loop.map(([u, x]) => W(u, f.z1, x))];
    }
    if (f.t === "cil") {
      const out = [];
      const a = f.F.a;
      const anillo = (s) => {
        for (let i = 0; i < 24; i++) out.push(G.pointOf(f.F, s, f.r, (i / 24) * Math.PI * 2));
      };
      if (Math.abs(a[2]) > 0.999) {
        const zs = (s) => f.F.o[2] + a[2] * s;
        const lo = a[2] > 0 ? f.s0 : f.s1, hi = a[2] > 0 ? f.s1 : f.s0;
        if (zs(hi) <= z) return [];
        anillo(zs(lo) >= z ? lo : (z - f.F.o[2]) / a[2]);
        anillo(hi);
        return out;
      }
      const n = Math.max(2, Math.ceil((f.s1 - f.s0) / 2));
      for (let j = 0; j <= n; j++) anillo(f.s0 + ((f.s1 - f.s0) * j) / n);
      return out.filter((p) => p[2] >= z);
    }
    const out = [];
    for (let i = 0; i <= 12; i++) {
      const th = (Math.PI * i) / 12;
      for (let j = 0; j < 24; j++) {
        const ph = (Math.PI * 2 * j) / 24;
        out.push([f.c[0] + f.r * Math.sin(th) * Math.cos(ph), f.c[1] + f.r * Math.sin(th) * Math.sin(ph), f.c[2] + f.r * Math.cos(th)]);
      }
    }
    return out.filter((p) => p[2] >= z);
  }
  const centro = (f) => {
    if (f.t === "caja") return W((f.u0 + f.u1) / 2, (f.z0 + f.z1) / 2, (f.x0 + f.x1) / 2);
    if (f.t === "prisma") {
      const n = f.loop.length;
      const [u, x] = f.loop.reduce((s, q) => [s[0] + q[0] / n, s[1] + q[1] / n], [0, 0]);
      return W(u, (f.z0 + f.z1) / 2, x);
    }
    if (f.t === "cil") return G.add3(f.F.o, G.mul3(f.F.a, (f.s0 + f.s1) / 2));
    return f.c;
  };
  // un elemento: una o varias formas, con su dibujo
  const item = (name, formas, svg, extra = {}) => ({ name, at: extra.at ?? centro(formas[0]), svg, formas: formas.map((f, i) => ({ ...f, name: f.name ?? (i ? `${name}.${i}` : name) })), ...extra });
  const pieza = (name, f, cls, opts = {}, extra = {}) => item(name, [f], `<g class="${cls}">${dib(f, opts)}</g>`, extra);

  // ======================= base y soportes =======================
  function base() {
    const out = [];
    const B = GEO.BASE;
    const f = caja(B.u0, B.u1, B.x0, B.x1, B.z0, B.z1);
    const ranura = pathOf(rect(B.u0 + 10, B.x0 + 10, B.u1 - 10, B.x1 - 10).map(sobre(B.z1)), true);
    const tornillos = [[B.u0 + 20, B.x0 + 20], [B.u1 - 20, B.x0 + 20], [B.u0 + 20, B.x1 - 20], [B.u1 - 20, B.x1 - 20]].map(sobre(B.z1));
    const halo = `<path class="iso-halo" d="${pathOf(rect(B.u0, B.x0, B.u1, B.x1).map(sobre(B.z0 - 8)), true)}"/>`;
    out.push(item("base.banco", [f], halo + `<g class="cs-banco">${dib(f, { tone: "lo", inner: k.lineSvg(ranura, { tone: "faint" }) + k.dotsSvg(tornillos, { size: 1.8, tone: "mid" }) })}</g>`, { bias: -900 }));
    GEO.PATAS.forEach((p, i) => out.push(pieza(`base.pata${i}`, cilZ(p.u, p.x, p.r, p.z0, p.z1, { ground: true }), "cs-goma", { tone: "lo" }, { bias: -1000 })));
    GEO.SOPORTES.forEach((s, i) => {
      const fs = caja(s.u0, s.u1, s.x0, s.x1, s.z0, s.z1);
      // dos tornillos en la cara de arriba de cada soporte, delante del tanque no: en la de delante
      const tor = [[s.u0 + 13, s.z1 - 14], [s.u1 - 13, s.z1 - 14], [s.u0 + 13, s.z0 + 14], [s.u1 - 13, s.z0 + 14]].map(([u, z]) => at(W(u, z, s.x1)));
      out.push(item(`soporte${i}`, [fs], `<g class="cs-soporte">${dib(fs, { inner: k.dotsSvg(tor, { size: 1.6, tone: "mid" }) })}</g>`));
    });
    return out;
  }

  // ======================= tanque =======================
  function tanque() {
    const out = [];
    const t = GEO.T, p = t.pared, ZL = GEO.Z_LLENO;
    out.push(pieza("tanque.suelo", caja(t.u0 - p, t.u1 + p, t.x0 - p, t.x1, -t.suelo, 0, { owner: "tanque" }), "cs-loza cs-proceso"));
    // la marca del nivel lleno: una raya en la pared de atrás y en la del lado, de borde a borde
    const marcaFondo = pathOf([[t.u0, t.x0], [t.u1, t.x0]].map(sobre(ZL)));
    out.push(pieza("tanque.fondo", caja(t.u0 - p, t.u1 + p, t.x0 - p, t.x0, 0, t.z1, { owner: "tanque" }), "cs-loza cs-proceso", { inner: `<g data-pieza="marca">${k.lineSvg(marcaFondo, { tone: "mid", className: "cs-marca" })}</g>` }));
    out.push(pieza("tanque.izq", caja(t.u0 - p, t.u0, t.x0, t.x1, 0, t.z1, { owner: "tanque" }), "cs-loza cs-proceso"));
    const marcaLado = pathOf([[t.u1, t.x0], [t.u1, t.x1]].map(sobre(ZL)));
    out.push(pieza("tanque.der", caja(t.u1, t.u1 + p, t.x0, t.x1, 0, t.z1, { owner: "tanque" }), "cs-loza cs-proceso", { inner: `<g data-pieza="marca">${k.lineSvg(marcaLado, { tone: "mid", className: "cs-marca" })}</g>` }));
    const Ta = GEO.TAPA;
    out.push(pieza("tapa", caja(Ta.u0, Ta.u1, Ta.x0, Ta.x1, Ta.z0, Ta.z1, { owner: "tanque" }), "cs-loza cs-tapa"));
    const Gu = GEO.GUIA;
    out.push(pieza("tapa.guia", cilZ(GEO.U_DES, GEO.X_DES, Gu.r, Gu.z0, Gu.z1, { owner: "descarga" }), "cs-plastico"));
    return out;
  }

  // ======================= válvula de descarga, rebosadero, pulsador y salida =======================
  const U = GEO.U_DES, X = GEO.X_DES;
  function descargaFormas(lift) {
    const [t0, t1] = GEO.zTapon(lift);
    const boca = GEO.zBoca(lift);
    const Pu = GEO.PUENTE;
    return {
      tapon: cilZ(U, X, GEO.TAPON.r, t0, t1, { owner: "descarga" }),
      tubo: cilZ(U, X, GEO.REB.r, t1, boca, { owner: "descarga" }),
      puente: caja(U - Pu.largo / 2, U + Pu.largo / 2, X - Pu.ancho / 2, X + Pu.ancho / 2, boca, boca + Pu.alto, { owner: "descarga" }),
      varilla: cilZ(U, X, GEO.VARILLA.r, boca + Pu.alto, GEO.GUIA.z0 + 24 + lift, { owner: "descarga" }),
    };
  }
  const taponSvg = (lift) => `<g class="cs-perturbacion cs-goma-roja">${dib(descargaFormas(lift).tapon)}</g>`;
  const tuboSvg = (lift) => {
    const f = descargaFormas(lift).tubo;
    const boca = pathOf(circulo(U, X, GEO.REB.rIn, 32).map(sobre(f.s1)), true);
    return `<g class="cs-plastico cs-rebosadero">${dib(f, { inner: `<path class="cs-boca" d="${boca}"/>` })}</g>`;
  };
  const puenteSvg = (lift) => `<g class="cs-plastico">${dib(descargaFormas(lift).puente)}</g>`;
  const varillaSvg = (lift) => `<g class="cs-acero">${dib(descargaFormas(lift).varilla)}</g>`;
  // pulsador doble: un aro sobre la tapa y dos botones (media descarga, el pequeño; completa, el grande)
  const Pp = GEO.PULSADOR, UP = U, XP = GEO.X_PULSADOR;
  function segmento(lado) {
    const r = Pp.r - 4;
    const d = Pp.corte + (lado === "completa" ? 0.9 : -0.9);
    const a = Math.asin(d / r);
    const desde = lado === "completa" ? a : Math.PI - a;
    const hasta = lado === "completa" ? Math.PI - a : 2 * Math.PI + a;
    return Array.from({ length: 33 }, (_, i) => {
      const q = desde + ((hasta - desde) * i) / 32;
      return [UP + r * Math.sin(q), XP + r * Math.cos(q)];
    });
  }
  const botonForma = (lado, boton) => prisma(segmento(lado), Pp.z1, Pp.z1 + Pp.alto - (boton === lado ? Pp.hunde : 0), { owner: "pulsador" });
  const botonSvg = (lado, boton) => `<g class="cs-pulsa${boton === lado ? " cs-pulsado" : ""}" data-boton="${lado}">${dib(botonForma(lado, boton))}</g>`;
  function descarga(e) {
    const out = [];
    const As = GEO.ASIENTO;
    const hueco = pathOf(circulo(U, X, As.rIn, 40).map(sobre(As.z1)), true);
    out.push(pieza("des.asiento", cilZ(U, X, As.r, As.z0, As.z1, { owner: "descarga" }), "cs-plastico", { inner: `<path class="cs-boca" d="${hueco}"/>` }));
    const F = descargaFormas(e.lift);
    out.push(item("des.tapon", [F.tapon], `<g data-vivo="des.tapon">${taponSvg(e.lift)}</g>`, { mueve: "tapon", rol: "perturbacion" }));
    out.push(item("des.rebosadero", [F.tubo], `<g data-vivo="des.rebosadero">${tuboSvg(e.lift)}</g>`, { mueve: "tapon" }));
    out.push(item("des.puente", [F.puente], `<g data-vivo="des.puente">${puenteSvg(e.lift)}</g>`, { mueve: "tapon" }));
    out.push(item("des.varilla", [F.varilla], `<g data-vivo="des.varilla">${varillaSvg(e.lift)}</g>`, { mueve: "tapon" }));
    const marco = cilZ(UP, XP, Pp.r, Pp.z0, Pp.z1, { owner: "pulsador" });
    out.push(pieza("pulsador.marco", marco, "cs-cromo"));
    for (const lado of ["media", "completa"]) out.push(item(`pulsador.${lado}`, [botonForma(lado, e.boton)], `<g data-vivo="pulsador.${lado}">${botonSvg(lado, e.boton)}</g>`, { mueve: "boton", rol: "perturbacion" }));
    // salida al inodoro, debajo del suelo del tanque
    const S = GEO.SALIDA;
    out.push(pieza("salida.tuerca", cilZ(U, X, S.tuerca.r, S.tuerca.z0, S.tuerca.z1, { owner: "salida" }), "cs-plastico"));
    out.push(pieza("salida.tubo", cilZ(U, X, S.tubo.r, S.tubo.z0, S.tuerca.z0, { owner: "salida" }), "cs-plastico"));
    out.push(pieza("salida.junta", cilZ(U, X, S.junta.r, S.junta.z0, S.junta.z1, { owner: "salida" }), "cs-goma"));
    return out;
  }

  // ======================= válvula de llenado =======================
  const C = GEO.CAMARA;
  const XB = GEO.X_BRAZO;
  // medio cilindro vertical: la mitad de atrás (x ≤ XB), cortada por el plano de la válvula
  const XM = XB + 1.5;
  const medio = (u, r, n = 24) => Array.from({ length: n + 1 }, (_, i) => {
    const a = Math.PI / 2 + (Math.PI * i) / n;
    return [u + r * Math.sin(a), XM + r * Math.cos(a)];
  });
  function obturadorFormas(ap) {
    const [z0, z1, z2] = GEO.zObturador(GEO.huecoDe(ap));
    return [prisma(medio(GEO.U_OBT, GEO.OBT.r), z0, z1, { owner: "valvula", name: "val.obturador" }), cilZ(GEO.U_OBT, XB, GEO.OBT.vastago, z1, z2, { owner: "valvula", name: "val.obturador.vastago" })];
  }
  const obturadorSvg = (ap) => {
    const [p, v] = obturadorFormas(ap);
    return `<g class="cs-obturador" data-abierta="${ap > 0 ? 1 : 0}" data-hueco="${Math.round(GEO.huecoDe(ap) * 1000) / 1000}">${dib(v)}${dib(p)}</g>`;
  };
  function valvula(e) {
    const out = [];
    const Ez = GEO.Z_ENTRADA;
    out.push(pieza("val.espiga", cilU(XB, Ez, GEO.ESPIGA.r, GEO.RACOR.u1, -GEO.T.pared - GEO.TUERCA_V.ancho, { owner: "valvula" }), "cs-laton"));
    out.push(pieza("val.tuerca_ext", cilU(XB, Ez, GEO.TUERCA_V.r, -GEO.T.pared - GEO.TUERCA_V.ancho, -GEO.T.pared, { owner: "valvula" }), "cs-plastico cs-controlador"));
    out.push(pieza("val.tuerca_int", cilU(XB, Ez, GEO.TUERCA_V.r, 0, C.u0, { owner: "valvula" }), "cs-plastico cs-controlador"));
    // el cuerpo, cortado por el plano del eje: en la cara de corte, el hueco por donde pasa el agua
    const xc = C.x1;
    const b = GEO.OBT.r + 2, e6 = 6, sz = GEO.SALIDA_V.z, sr = GEO.SALIDA_V.r;
    const hueco = [
      [C.u0, Ez - e6], [GEO.U_OBT - e6, Ez - e6], [GEO.U_OBT - e6, GEO.ASIENTO_V.z0], [GEO.U_OBT - b, GEO.ASIENTO_V.z0], [GEO.U_OBT - b, GEO.CILINDRO.z1],
      [GEO.U_OBT - GEO.OBT.vastago, GEO.CILINDRO.z1], [GEO.U_OBT - GEO.OBT.vastago, C.z1], [GEO.U_OBT + GEO.OBT.vastago, C.z1], [GEO.U_OBT + GEO.OBT.vastago, GEO.CILINDRO.z1],
      [GEO.U_OBT + b, GEO.CILINDRO.z1], [GEO.U_OBT + b, sz + sr], [C.u1, sz + sr], [C.u1, sz - sr], [GEO.U_OBT + b, sz - sr],
      [GEO.U_OBT + b, GEO.ASIENTO_V.z0], [GEO.U_OBT + e6, GEO.ASIENTO_V.z0], [GEO.U_OBT + e6, Ez + e6], [C.u0, Ez + e6],
    ].map(([u, z]) => at(W(u, z, xc)));
    // la forma: el cuerpo con su hueco (cinco cajas alrededor del cilindro y el paso del vástago)
    const Ci = GEO.CILINDRO, vs = GEO.OBT.vastago + 2;
    const o = { owner: "valvula" };
    const cuerpo = [
      caja(C.u0, C.u1, C.x0, Ci.x0, C.z0, C.z1, o),
      caja(C.u0, Ci.u0, Ci.x0, C.x1, C.z0, C.z1, o),
      caja(Ci.u1, C.u1, Ci.x0, C.x1, C.z0, C.z1, o),
      caja(Ci.u0, Ci.u1, Ci.x0, C.x1, C.z0, Ci.z0, o),
      caja(Ci.u0, GEO.U_OBT - vs, Ci.x0, C.x1, Ci.z1, C.z1, o),
      caja(GEO.U_OBT + vs, Ci.u1, Ci.x0, C.x1, Ci.z1, C.z1, o),
      caja(GEO.U_OBT - vs, GEO.U_OBT + vs, Ci.x0, GEO.X_BRAZO - GEO.OBT.vastago - 2, Ci.z1, C.z1, o),
    ];
    const dibCuerpo = zprism([rect(C.u0, C.x0, C.u1, C.x1)], C.z0, C.z1, { tone: "mid", inner: `<path class="cs-hueco" d="${pathOf(hueco, true)}"/>` });
    out.push(item("val.camara", cuerpo, `<g class="cs-plastico cs-controlador">${dibCuerpo}</g>`, { rol: "controlador", at: W((C.u0 + C.u1) / 2, (C.z0 + C.z1) / 2, (C.x0 + C.x1) / 2) }));
    // el asiento: un anillo de latón (cortado) con el paso del agua en medio
    const Av = GEO.ASIENTO_V;
    const anillo = [...medio(GEO.U_OBT, Av.r), ...medio(GEO.U_OBT, 6).reverse()];
    out.push(pieza("val.asiento", prisma(anillo, Av.z0, Av.z1, { owner: "valvula" }), "cs-laton", {}, { rol: "controlador" }));
    out.push(item("val.obturador", obturadorFormas(e.ap), `<g data-vivo="val.obturador">${obturadorSvg(e.ap)}</g>`, { mueve: "obturador", rol: "controlador" }));
    const Sv = GEO.SALIDA_V, xs = Sv.x;
    const sal = [cilU(xs, Sv.z, Sv.r, C.u1, Sv.u1, { owner: "valvula", name: "val.salida" }), bola(W(Sv.u1, Sv.z, xs), Sv.bola, { owner: "valvula", name: "val.salida.codo" }), cilZ(Sv.u1, xs, Sv.r, Sv.z0, Sv.z, { owner: "valvula", name: "val.salida.boquilla" })];
    const boquilla = pathOf(circulo(Sv.u1, xs, Sv.r - 1.4, 20).map(sobre(Sv.z0)), true);
    out.push(item("val.salida", sal, `<g class="cs-plastico cs-controlador">${dib(sal[0])}${dib(sal[2], { inner: `<path class="cs-boca" d="${boquilla}"/>` })}${dib(sal[1])}</g>`, { rol: "controlador" }));
    const O = GEO.OREJA;
    out.push(pieza("val.oreja", caja(O.u0, O.u1, O.x0, O.x1, O.z0, O.z1, { owner: "valvula" }), "cs-plastico cs-controlador", {}, { rol: "controlador" }));
    return out;
  }

  // ======================= brazo y boya (con boya) =======================
  const PV = W(GEO.PIVOTE.u, GEO.PIVOTE.z, XB);
  function brazoFormas(V) {
    const c = GEO.centroBoya(V);
    const C3 = W(c.u, c.z, XB);
    const dir = G.unit3(G.sub3(C3, PV));
    const en = (s) => G.add3(PV, G.mul3(dir, s));
    const pt = GEO.puntaPalanca(V);
    const T3 = W(pt.u, pt.z, XB);
    const Aj = GEO.AJUSTE;
    // el tornillo de ajuste: perpendicular al brazo, en su plano, hacia arriba
    const arriba = G.unit3(G.cross3([1, 0, 0], dir));
    const n = arriba[2] >= 0 ? arriba : G.mul3(arriba, -1);
    const sc = (Aj.s0 + Aj.s1) / 2;
    const t0 = G.add3(en(sc), G.mul3(n, Aj.r - 0.6));
    return {
      palanca: varilla(PV, T3, GEO.PALANCA.r, { owner: "valvula", name: "brazo.palanca" }),
      punta: cilX(pt.u, pt.z, GEO.PALANCA.punta, XB - GEO.PALANCA.rodillo, XB + GEO.PALANCA.rodillo, { owner: "valvula", name: "brazo.rodillo" }),
      cubo: cilX(GEO.PIVOTE.u, GEO.PIVOTE.z, GEO.PIVOTE.cubo, GEO.PIVOTE.x0, GEO.PIVOTE.x1, { owner: "valvula", name: "brazo.cubo" }),
      pasador: cilX(GEO.PIVOTE.u, GEO.PIVOTE.z, GEO.PIVOTE.r, GEO.PIVOTE.x1, GEO.PIVOTE.x2, { owner: "valvula", name: "brazo.pasador" }),
      varilla: varilla(PV, en(GEO.BRAZO.L - GEO.BOYA.r + 0.3), GEO.BRAZO.r, { owner: "valvula", name: "brazo.varilla" }),
      ajuste: varilla(en(Aj.s0), en(Aj.s1), Aj.r, { owner: "valvula", name: "brazo.ajuste" }),
      tornillo: varilla(t0, G.add3(t0, G.mul3(n, Aj.alto)), Aj.tornillo, { owner: "valvula", name: "brazo.tornillo" }),
      boya: bola(C3, GEO.BOYA.r, { owner: "valvula", name: "boya" }),
      n,
      dir,
    };
  }
  const brazoSvg = (V) => {
    const F = brazoFormas(V);
    // ranura del tornillo, en su cabeza
    const top = G.add3(F.tornillo.F.o, G.mul3(F.tornillo.F.a, F.tornillo.s1));
    const ranura = pathOf([G.add3(top, G.mul3(F.dir, -GEO.AJUSTE.tornillo + 1)), G.add3(top, G.mul3(F.dir, GEO.AJUSTE.tornillo - 1))].map(at));
    return `<g class="cs-brazo" data-angulo="${Math.round(GEO.anguloBrazo(V) * 100) / 100}">${dib(F.varilla)}${dib(F.palanca)}<g class="cs-acero">${dib(F.punta)}</g>${dib(F.cubo)}<g class="cs-acero">${dib(F.pasador)}</g><g class="cs-ajuste">${dib(F.ajuste)}</g><g class="cs-tornillo" data-pieza="tornillo">${dib(F.tornillo, { inner: k.lineSvg(ranura, { tone: "hi", className: "cs-ranura" }) })}</g></g>`;
  };
  const boyaSvg = (V) => {
    const F = brazoFormas(V);
    return `<g class="cs-boya" data-centro="${F.boya.c.map((v) => Math.round(v * 100) / 100).join(",")}">${dib(F.boya)}</g>`;
  };
  function brazo(e) {

    if (!punto) continue;
    const [ax, ay] = at(punto);
    linea.setAttribute("d", `M${et.guia[0]} ${et.guia[1]}L${f1(ax)} ${f1(ay)}`);
    fin.setAttribute("cx", f1(ax));
    fin.setAttribute("cy", f1(ay));
  }
}
const gruposDe = (id) => {
  const ids = NM.GRUPO?.[id] ?? [id];
  return [...items.filter((g) => ids.includes(NM.piezaDe(g.dataset.name))), ...ids.flatMap((i) => [...svg.querySelectorAll(`[data-pieza="${i}"]`)])];
};
let resaltadas = [];
let etiquetaDe = null;
function mostrarUna() {
  const sel = hover ?? pinned;
  const key = sel ? sel.id : null;
  if (key !== etiquetaDe) {
    etiquetaDe = key;
    for (const g of resaltadas) g.classList.remove("cs-sel");
    resaltadas = sel ? gruposDe(sel.id) : [];
    for (const g of resaltadas) g.classList.add("cs-sel");
    stage.dataset.pieza = sel ? sel.id : "";
  }
  capaUna.replaceChildren();
  if (!sel) return;
  const anc = NM.anclas(ctx());
  const a = anc[sel.id] ? at(anc[sel.id]) : sel.at;
  if (!a) return;
  const vb = svg.viewBox.baseVal;
  const izq = a[0] > vb.width * 0.62;
  const g = el("g", { class: "cs-una" });
  const texto = el("text", { x: 0, y: 0, "text-anchor": izq ? "end" : "start" }, NM.NOMBRE[sel.id]);
  const caja = el("rect", { rx: 3 });
  g.append(caja, texto, el("circle", { class: "cs-npunto", r: "2.2", cx: f1(a[0]), cy: f1(a[1]) }));
  capaUna.append(g);
  contornoOculto(g, sel.id);
  const box = texto.getBBox();
  let xx = izq ? a[0] - 9 : a[0] + 9;
  let y = a[1] + 30;
  const w = box.width + 12, h = box.height + 7;
  if (izq && xx - w < vb.x + 4) xx = vb.x + 4 + w;
  if (!izq && xx + w > vb.x + vb.width - 4) xx = vb.x + vb.width - 4 - w;
  y = Math.min(vb.y + vb.height - h / 2 - 2, Math.max(vb.y + h / 2 + 2, y));
  texto.setAttribute("x", f1(izq ? xx - 6 : xx + 6));
  texto.setAttribute("y", f1(y + box.height * 0.32));
  caja.setAttribute("x", f1(izq ? xx - w : xx));
  caja.setAttribute("y", f1(y - h / 2));
  caja.setAttribute("width", f1(w));
  caja.setAttribute("height", f1(h));
}
function verTodos(on) {
  todos = on;
  capaTodos.style.display = on ? "" : "none";
  stage.toggleAttribute("data-nombres", on);
  if (on) ponerGuias();
  avisar(on ? "Nombres de las piezas a la vista" : "Nombres ocultos");
  ponerMandos();
}

// ---------- «Ver el lazo» ----------
let lazo = false;
const guiasL = [...capaLazo.querySelectorAll("[data-pieza-guia]")];
function anclaLazo(id, anc) {
  if (id === "agua") return W3(GEO.T.u0 + 250, GEO.nivelDe(s.V), GEO.T.x1);
  if (id === "marca") return W3(GEO.T.u0 + 300, GEO.Z_LLENO, GEO.T.x0);
  return anc[id];
}
const flechaBrazo = capaLazo.querySelector("[data-flecha-brazo]");
function guiasLazo() {
  const anc = NM.anclas(ctx());
  if (s.modo === "boya") {
    // sobre el brazo, un poco por encima: de la boya hacia la válvula
    const F = E.brazoFormas(s.V);
    const P0 = W3(GEO.PIVOTE.u, GEO.PIVOTE.z, GEO.X_BRAZO);
    const en = (d, h) => G.add3(G.add3(P0, G.mul3(F.dir, d)), G.mul3(F.n, h));
    const pts = [en(GEO.BRAZO.L - GEO.BOYA.r - 6, 13), en(GEO.AJUSTE.s1 + 14, 13)].map(at);
    const [a, b] = pts;
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const t = [(b[0] - a[0]) / l, (b[1] - a[1]) / l], n = [-t[1], t[0]];
    const base = [b[0] - t[0] * 12, b[1] - t[1] * 12];
    const ps = flechaBrazo.querySelectorAll("path");
    ps[0].setAttribute("d", pathOf([a, b]));
    ps[1].setAttribute("d", pathOf([a, base]));
    ps[2].setAttribute("d", pathOf([b, [base[0] + n[0] * 5.5, base[1] + n[1] * 5.5], [base[0] - n[0] * 5.5, base[1] - n[1] * 5.5]], true));
  }
  for (const g of guiasL) {
    if (g.dataset.solo !== s.modo) continue;
    const b = LZ.BLOQUES.find((q) => q.id === g.dataset.guiaDe);
    const p = anclaLazo(g.dataset.piezaGuia, anc);
    if (!p) continue;
    const a = at(p);
    const o = LZ.salidaGuia(b, a);
    g.querySelector("path").setAttribute("d", `M${f1(o[0])} ${f1(o[1])}L${f1(a[0])} ${f1(a[1])}`);
    const c = g.querySelector("circle");
    c.setAttribute("cx", f1(a[0]));
    c.setAttribute("cy", f1(a[1]));
  }
}
function verLazo(on) {
  lazo = on;
  if (on) guiasLazo();
  capaLazo.style.display = on ? "" : "none";
  stage.toggleAttribute("data-lazo", on);
  avisar(on ? (s.modo === "boya" ? "Lazo cerrado: consigna, válvula, tanque, nivel y la realimentación desde la boya" : "Lazo abierto: sin boya no hay realimentación") : "Diagrama del lazo oculto");
  ponerMandos();
}

// ---------- tocar o señalar una pieza ----------
const enVB = (event) => {
  const m = svg.getScreenCTM();
  if (!m) return [0, 0];
  const q = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  return [q.x, q.y];
};
function piezaEn(target) {
  const dp = target.closest?.("[data-pieza]");
  if (dp && svg.contains(dp)) return dp.dataset.pieza;
  const g = target.closest?.(".it");
  if (g && svg.contains(g)) return NM.piezaDe(g.dataset.name);
  return null;
}
let down = null;
stage.addEventListener("pointerdown", (event) => {
  down = { x: event.clientX, y: event.clientY, id: piezaEn(event.target), at: enVB(event), moved: false };
});
stage.addEventListener("pointermove", (event) => {
  if (down) {
    if (Math.hypot(event.clientX - down.x, event.clientY - down.y) > 6) down.moved = true;
    return;
  }
  if (event.pointerType !== "mouse") return;
  const id = piezaEn(event.target);
  const next = id ? { id, at: enVB(event) } : null;
  if ((next?.id ?? null) !== (hover?.id ?? null)) {
    hover = next;
    mostrarUna();
  }
});
stage.addEventListener("pointerleave", (event) => {
  if (event.pointerType === "mouse" && hover && !down) {
    hover = null;
    mostrarUna();
  }
});
const soltar = (event) => {
  if (event.type === "pointerup" && down && !down.moved) {
    pinned = down.id ? { id: down.id, at: down.at } : null;
    if (event.pointerType !== "mouse") hover = null;
    mostrarUna();
    avisar(pinned ? NM.NOMBRE[pinned.id] : "");
  }
  down = null;
};
stage.addEventListener("pointerup", soltar);
stage.addEventListener("pointercancel", soltar);
stage.addEventListener("contextmenu", (event) => event.preventDefault());
document.addEventListener("pointerdown", (event) => {
  if (pinned && !stage.contains(event.target) && !event.target.closest?.(".cs-boton")) {
    pinned = null;
    mostrarUna();
  }
});

// ---------- botones: cada uno dice lo que hace y equivale a su tecla ----------
const mando = (name) => plate.querySelector(`[data-mando="${name}"]`);
const bCompleta = mando("completa"), bMedia = mando("media"), bBoya = mando("boya"), bLazo = mando("lazo"), bPausa = mando("pausa"), bLento = mando("lento"), bNombres = mando("nombres"), bMax = mando("maximizar"), bSalir = mando("salir");
let textos = "";
function ponerMandos() {
  const key = `${s.modo}|${lazo}|${slow}|${todos}|${pausa}`;
  if (key === textos) return;
  textos = key;
  const t = (b, texto, label, pressed) => {
    b.querySelector("[data-texto]").textContent = texto;
    b.setAttribute("aria-label", label);
    if (pressed !== undefined) b.setAttribute("aria-pressed", String(pressed));
  };
  t(bBoya, s.modo === "boya" ? "Quitar la boya (lazo abierto)" : "Poner la boya (lazo cerrado)", s.modo === "boya" ? "Quitar la boya: la válvula se abre 30 segundos con un reloj, sin mirar el nivel (lazo abierto)" : "Poner la boya: la boya mide el nivel y cierra la válvula (lazo cerrado)");
  t(bLazo, lazo ? "Quitar el lazo" : "Ver el lazo", lazo ? "Quitar el diagrama del lazo" : "Ver el lazo: el diagrama de bloques sobre la cisterna", lazo);
  t(bPausa, pausa ? "Reanudar" : "Pausa", pausa ? "Reanudar: seguir con el tiempo" : "Pausa: parar el tiempo", pausa);
  t(bLento, slow ? "Velocidad normal" : "Ir lento", slow ? "Volver a la velocidad normal" : "Ir lento: ver la cisterna 4 veces más despacio", slow);
  t(bNombres, todos ? "Quitar nombres" : "Ver nombres", todos ? "Quitar los nombres de las piezas" : "Ver los nombres de las piezas", todos);
}

// ---------- Maximizar: pantalla completa (o la tarjeta a toda la ventana) ----------
let maxi = false;
let fsPedida = false;
let antes = null;
const fsEl = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
function ponerMax(on) {
  if (on === maxi) return;
  maxi = on;
  plate.classList.toggle("cs-max", on);
  document.documentElement.classList.toggle("cs-max-abierto", on);
  bSalir.hidden = !on;
  bMax.setAttribute("aria-pressed", String(on));
  avisar(on ? "Pantalla completa: pulsa Salir o Esc para volver" : "Tamaño normal");
  etiquetaDe = null;
  if (hover || pinned) mostrarUna();
}
function maximizar() {
  if (maxi) return;
  antes = { x: scrollX, y: scrollY, foco: document.activeElement };
  ponerMax(true);
  bSalir.focus({ preventScroll: true });
  const pedirFs = plate.requestFullscreen ?? plate.webkitRequestFullscreen;
  if (!pedirFs) return;
  try {
    fsPedida = true;
    const r = pedirFs.call(plate);
    if (r && r.catch) r.catch(() => (fsPedida = false));
  } catch {
    fsPedida = false;
  }
}
function salir() {
  if (!maxi) return;
  fsPedida = false;
  if (fsEl()) {
    const fuera = document.exitFullscreen ?? document.webkitExitFullscreen;
    try {
      const r = fuera?.call(document);
      if (r && r.catch) r.catch(() => {});
    } catch {}
  }
  ponerMax(false);
  if (antes) {
    const { x: sx, y: sy, foco } = antes;
    const volver = () => scrollTo(sx, sy);
    volver();
    requestAnimationFrame(volver);
    setTimeout(volver, 300);
    (foco && document.contains(foco) && foco !== bSalir && foco !== document.body ? foco : bMax).focus({ preventScroll: true });
    antes = null;
  }
}
const alCambiar = () => {
  if (fsEl() === plate) return;
  if (maxi && fsPedida) salir();
};
document.addEventListener("fullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenerror", () => (fsPedida = false));

bCompleta.addEventListener("click", () => descargar("completa"));
bMedia.addEventListener("click", () => descargar("media"));
bBoya.addEventListener("click", alternarBoya);
bLazo.addEventListener("click", () => verLazo(!lazo));
bPausa.addEventListener("click", alternarPausa);
bLento.addEventListener("click", alternarLento);
bNombres.addEventListener("click", () => verTodos(!todos));
bMax.addEventListener("click", maximizar);
bSalir.addEventListener("click", salir);

const libre = (event) => !event.ctrlKey && !event.metaKey && !event.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName ?? "");
document.addEventListener("keydown", (event) => {
  if (!libre(event)) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  const acciones = { c: () => descargar("completa"), h: () => descargar("media"), b: alternarBoya, l: () => verLazo(!lazo), " ": alternarPausa, s: alternarLento, n: () => verTodos(!todos), m: () => (maxi ? salir() : maximizar()) };
  if (acciones[key]) {
    if (key === " " && event.target?.closest?.("button")) return; // la barra espaciadora ya pulsa el botón con el foco
    event.preventDefault();
    acciones[key]();
  } else if (key === "Escape") {
    if (pinned || hover) {
      pinned = hover = null;
      mostrarUna();
    }
    if (maxi) salir();
  }
});

// ---------- ganchos para las comprobaciones (verifica.mjs y capturas) ----------
// fija la cisterna: modo, volumen; antes (una descarga anterior, completa); descarga y avanza t s del modelo
stage.__fijar = ({ modo = "boya", V, antes: previa, descarga, avanza = 0, final = false } = {}) => {
  fijada = true;
  s = M.inicial(previa ? previa.modo : modo);
  if (previa) {
    M.pulsar(s, previa.descarga);
    M.hastaElFinal(s);
    M.cambiarModo(s, modo);
  }
  if (V !== undefined) s.V = V;
  if (descarga) M.pulsar(s, descarga);
  if (avanza) M.avanza(s, avanza);
  if (final) M.hastaElFinal(s);
  resto = 0;
  dicho = "";
  grafDe = "";
  dibujado = {};
  draw();
  return readout.textContent;
};
stage.__marcha = () => {
  fijada = false;
  run();
};
stage.__estado = () => ({ modo: s.modo, V: f2(s.V), Vx: s.V, Q: M.caudal(s), ap: M.apertura(s), lift: elevacion(s), rebosado: s.rebosado, t: M.tiempo(s), valvula: M.valvula(s), estado: M.estadoDe(s), descarga: s.descarga ? s.descarga.tipo : null, pausa, slow, todos, lazo, max: maxi, fs: Boolean(fsEl()), quieta: still.matches, boyaT: bBoya.querySelector("[data-texto]").textContent, traza: s.traza.length });
stage.__anclas = () => Object.fromEntries(Object.entries(NM.anclas(ctx())).filter(([, q]) => q).map(([id, q]) => [id, at(q).map(f1)]));
const queHay = (q) => {
  const a = at(q);
  const c = new DOMPoint(a[0], a[1]).matrixTransform(svg.getScreenCTM());
  const hit = document.elementFromPoint(c.x, c.y);
  return hit ? piezaEn(hit) : null;
};
stage.__visibles = () => {
  const anc = NM.anclas(ctx());
  return Object.fromEntries(NM.ETIQUETAS.map((q) => q.id).filter((id) => anc[id]).map((id) => [id, queHay(anc[id])]));
};
// lo dibujado: la raya del nivel, la boya, el brazo, el obturador, la gráfica y los flujos (viewBox)
stage.__dibujo = () => {
  const nums = (d) => (d ?? "").match(/-?\d+(?:\.\d+)?/g)?.map(Number) ?? [];
  const tr = grafCaja.querySelector(".cs-g-traza");
  const vis = (n) => getComputedStyle(svg.querySelector(`.it[data-name="${n}"]`)).display !== "none";
  return {
    linea: nums(agua.linea.getAttribute("d")),
    frente: nums(agua.frente.getAttribute("d")),
    boya: svg.querySelector(".cs-boya")?.dataset.centro?.split(",").map(Number) ?? null,
    boyaVisible: vis("boya"),
    brazo: Number(svg.querySelector(".cs-brazo")?.dataset.angulo),
    relojVisible: vis("reloj"),
    hueco: Number(svg.querySelector(".cs-obturador").dataset.hueco),
    abierta: svg.querySelector(".cs-obturador").dataset.abierta,
    obturadorColor: getComputedStyle(svg.querySelector(".cs-obturador .iso-top")).fill,
    obturadorTapa: nums(svg.querySelector(".cs-obturador > g:last-child .iso-edge")?.getAttribute("d")),
    traza: nums(tr?.getAttribute("d")),
    trazaModo: tr?.dataset.modo ?? null,
    anterior: nums(grafCaja.querySelector(".cs-g-ant")?.getAttribute("d")),
    rebose: nums(grafCaja.querySelector(".cs-g-rebose")?.getAttribute("d")),
    chorro: Number(capas.chorro.querySelector(".cs-chorro")?.dataset.ancho ?? 0),
    flechasRed: capas.red.children.length,
    flechasSalida: capas.salida.children.length,
    flechasRebose: capas.rebose.children.length,
    mascara: (agua.negro.getAttribute("d") ?? "").split("M").length - 1,
  };
};

quieta();
draw();
ponerMandos();
