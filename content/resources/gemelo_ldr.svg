<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Esquema de la LDR del shield: la LDR entre 5 V y A1, una resistencia de 10 kΩ entre A1 y GND; LED de la farola en el pin 12 con 470 Ω.</title><rect width="860" height="430" fill="white"/><text x="30" y="36" font-size="19" fill="#2c6046" text-anchor="start" font-weight="bold">La LDR del shield: un divisor de tensión hacia A1</text><polyline points="144,80 176,80" fill="none" stroke="#c43232" stroke-width="3" stroke-linejoin="round"/><text x="160" y="72" font-size="15" fill="#c43232" text-anchor="middle" font-weight="bold">5 V</text><polyline points="160,80 160,105" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="160,105 160,125" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="151" y="125" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="160,175 160,195" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="160" cy="150" r="30" fill="none" stroke="#263c4a" stroke-width="2"/><line x1="98" y1="118" x2="130" y2="136" stroke="#16725e" stroke-width="2"/><polygon points="130,136 118.1,134.7 122.7,126.5" fill="#16725e"/><line x1="98" y1="134" x2="130" y2="152" stroke="#16725e" stroke-width="2"/><polygon points="130,152 118.1,150.7 122.7,142.5" fill="#16725e"/><text x="198" y="155" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">LDR</text><polyline points="160,195 160,230" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="160" cy="230" r="5" fill="#263c4a"/><polyline points="160,230 340,230" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="160,235 160,255" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="151" y="255" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="160,305 160,325" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="176" y="285" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">10 kΩ</text><polyline points="160,325 160,335" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="144,335 176,335" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="150,341 170,341" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="156,347 164,347" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/><polyline points="530,120 650,120 650,150" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="340" y="80" width="190" height="250" rx="14" fill="#eef5f0" stroke="#2c6046" stroke-width="2.5"/><text x="435" y="190" font-size="20" fill="#2c6046" text-anchor="middle" font-weight="bold">Arduino</text><rect x="333" y="223" width="14" height="14" fill="#2c6046"/><text x="354" y="236" font-size="15" fill="#2c6046" text-anchor="start" font-weight="bold">A1</text><rect x="523" y="113" width="14" height="14" fill="#2c6046"/><text x="516" y="126" font-size="15" fill="#2c6046" text-anchor="end" font-weight="bold">12</text><text x="30" y="385" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Mucha luz: la LDR baja su resistencia, A1 se acerca a 5 V y analogRead da un número alto.</text><text x="30" y="410" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">Oscuridad: la LDR sube su resistencia, A1 se acerca a 0 V y el número es bajo.</text><polyline points="650,150 650,170" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><rect x="641" y="170" width="18" height="50" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="650,220 650,240" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><text x="666" y="200" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">470 Ω</text><polyline points="650,240 650,266" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polygon points="636,266 664,266 650,290" fill="white" stroke="#263c4a" stroke-width="2.5"/><polyline points="636,290 664,290" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="650,290 650,320" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><line x1="668" y1="268" x2="690" y2="254" stroke="#b93649" stroke-width="2"/><polygon points="690,254 683.2,263.9 678.2,256.0" fill="#b93649"/><line x1="668" y1="282" x2="690" y2="268" stroke="#b93649" stroke-width="2"/><polygon points="690,268 683.2,277.9 678.2,270.0" fill="#b93649"/><text x="696" y="288" font-size="15" fill="#263c4a" text-anchor="start" font-weight="normal">farola</text><polyline points="650,320 650,330" fill="none" stroke="#263c4a" stroke-width="2.5" stroke-linejoin="round"/><polyline points="634,330 666,330" fill="none" stroke="#2f5fa8" stroke-width="3" stroke-linejoin="round"/><polyline points="640,336 660,336" fill="none" stroke="#2f5fa8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="646,342 654,342" fill="none" stroke="#2f5fa8" stroke-width="2" stroke-linejoin="round"/></svg>