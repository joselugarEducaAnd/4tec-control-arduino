<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>El sensor de ultrasonidos emite un pulso, el eco vuelve del obstáculo y la distancia es el tiempo por 0,0343 dividido entre 2. Conexión: VCC a 5 V, Trig a D7, Echo a D8 y GND.</title><rect width="820" height="470" fill="white"/><text x="30" y="36" font-size="19" fill="#2c6046" text-anchor="start" font-weight="bold">Cómo mide el sensor de ultrasonidos</text><rect x="40" y="90" width="150" height="80" rx="8" fill="#2f6fb0" stroke="#263c4a" stroke-width="2.5"/><circle cx="80" cy="130" r="26" fill="#d9dde3" stroke="#263c4a" stroke-width="2"/><circle cx="150" cy="130" r="26" fill="#d9dde3" stroke="#263c4a" stroke-width="2"/><text x="80" y="195" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Trig</text><text x="80" y="212" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">emite</text><text x="150" y="195" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="bold">Echo</text><text x="150" y="212" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal">escucha</text><path d="M230,100 q16,30 0,60" fill="none" stroke="#16725e" stroke-width="3"/><path d="M270,100 q16,30 0,60" fill="none" stroke="#16725e" stroke-width="3"/><path d="M310,100 q16,30 0,60" fill="none" stroke="#16725e" stroke-width="3"/><line x1="230" y1="85" x2="560" y2="85" stroke="#16725e" stroke-width="3"/><polygon points="560,85 548.9,89.7 548.9,80.3" fill="#16725e"/><text x="395.0" y="75.0" font-size="15" fill="#16725e" text-anchor="middle" font-weight="normal">ida</text><line x1="560" y1="175" x2="230" y2="175" stroke="#d9822b" stroke-width="3"/><polygon points="230,175 241.1,170.3 241.1,179.7" fill="#d9822b"/><text x="395.0" y="199.0" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="normal">vuelta (eco)</text><rect x="580" y="60" width="40" height="140" fill="#b0855a" stroke="#263c4a" stroke-width="2"/><text x="600" y="225" font-size="14" fill="#263c4a" text-anchor="middle" font-weight="normal">obstáculo</text><polyline points="190,250 580,250" fill="none" stroke="#6b7785" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="385" y="270" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="bold">distancia d</text><text x="30" y="315" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">pulseIn mide el tiempo t que tarda el eco, en microsegundos.</text><text x="30" y="342" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">El sonido recorre 0,0343 cm cada microsegundo y hace el camino dos veces (ida y vuelta):</text><text x="330" y="382" font-size="24" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">d = t · 0,0343 / 2</text><text x="30" y="425" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Conexión: VCC → 5 V · Trig → D7 · Echo → D8 · GND → GND</text><text x="30" y="450" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">En Tinkercad: «Sensor de distancia ultrasónico (4 pines)».</text></svg>