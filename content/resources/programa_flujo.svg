<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Estructura de un programa de Arduino: setup se ejecuta una vez y loop se repite; dentro de loop, leer, decidir y actuar.</title><rect width="940" height="320" fill="white"/><rect x="60" y="30" width="300" height="60" rx="10" fill="#eef5f0" stroke="#263c4a" stroke-width="2.5"/><text x="210.0" y="56.0" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">setup()</text><text x="210.0" y="75.2" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="normal">una sola vez, al encender</text><line x1="210" y1="90" x2="210" y2="140" stroke="#263c4a" stroke-width="2.5"/><polygon points="210,140 205.3,128.9 214.7,128.9" fill="#263c4a"/><rect x="60" y="140" width="300" height="60" rx="10" fill="#eef5f0" stroke="#263c4a" stroke-width="2.5"/><text x="210.0" y="166.0" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">loop()</text><text x="210.0" y="185.2" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="normal">se repite sin parar</text><rect x="430" y="60" width="200" height="50" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="530.0" y="90.6" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">1. Leer</text><rect x="430" y="145" width="200" height="50" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="530.0" y="175.6" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">2. Decidir</text><rect x="430" y="230" width="200" height="50" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="530.0" y="260.6" font-size="16" fill="#263c4a" text-anchor="middle" font-weight="bold">3. Actuar</text><line x1="530" y1="110" x2="530" y2="145" stroke="#d9822b" stroke-width="2.5"/><polygon points="530,145 525.3,133.9 534.7,133.9" fill="#d9822b"/><line x1="530" y1="195" x2="530" y2="230" stroke="#d9822b" stroke-width="2.5"/><polygon points="530,230 525.3,218.9 534.7,218.9" fill="#d9822b"/><polyline points="630,255 680,255 680,85" fill="none" stroke="#d9822b" stroke-width="2.5" stroke-linejoin="round"/><line x1="680" y1="85" x2="630" y2="85" stroke="#d9822b" stroke-width="2.5"/><polygon points="630,85 641.1,80.3 641.1,89.7" fill="#d9822b"/><polyline points="360,170 430,170" fill="none" stroke="#d9822b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="700" y="90" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">los sensores:</text><text x="700" y="108" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">digitalRead, analogRead</text><text x="700" y="175" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">comparar:</text><text x="700" y="193" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">if … else</text><text x="700" y="255" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal">las salidas:</text><text x="700" y="273" font-size="14" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">digitalWrite, analogWrite</text><text x="60" y="250" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Todo programa de control</text><text x="60" y="272" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">repite estos tres pasos</text><text x="60" y="294" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">muchas veces por segundo.</text></svg>