/* pie: lectura y osciloscopio; debajo, el ángulo pedido, la pista y los mandos */
.sv-pie{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);grid-template-areas:"lectura osc" "izq izq";align-items:start;gap:14px 26px;margin:10px -4px 0}
.sv-lectura{grid-area:lectura;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.sv-l{display:block;font-size:19px;line-height:1.36;font-weight:500}
.sv-l b{font-weight:750}
.sv-estado{font-size:38px;line-height:1.1;font-weight:800;letter-spacing:.005em;margin-bottom:4px;color:var(--anatomy-strong)}
.sv-ped::before,.sv-med::before,.sv-mot::before,.sv-senal::before{content:"";display:inline-block;width:.62em;height:.62em;margin-right:.42em;border-radius:2px;vertical-align:.06em}
.sv-ped::before{background:#c25a00}
.sv-med::before{background:#7a3aa8}
.sv-mot::before{background:#1f5fd6}
.sv-senal::before{background:#c25a00;border-radius:50%}
.sv-err-v{display:inline-block;padding:0 .32em;border-radius:5px;border:1.5px solid}
.sv-err-v[data-error="0"]{color:#1f2433;background:#eceef1;border-color:#9aa1ad}
.sv-err-v[data-error="1"]{color:#7d0c24;background:#fde3e8;border-color:#c2183b}
.sv-ritmo{color:#3d3d42}
.sv-osc{grid-area:osc;display:flex;flex-direction:column;gap:4px}
.sv-osc-t,.sv-angulo-t{font-family:var(--anatomy-mono);font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#46464b}
.sv-oscilo{display:block;width:100%;height:auto;max-width:320px}
.sv-osc-fondo{fill:#f3f5f2;stroke:#3d4250;stroke-width:1.2px}
.sv-osc-rejilla{stroke:#c9cec6;stroke-width:1px;fill:none}
.sv-osc-onda{fill:none;stroke:#c25a00;stroke-width:2.6px;stroke-linejoin:miter}
.sv-osc-cota,.sv-osc-per{fill:none;stroke:#1f2433;stroke-width:1.2px}
.sv-oscilo text{font:600 15px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1f2433}
.sv-oscilo text.sv-osc-w{font-weight:800;fill:#7a3a00}
.sv-izq{grid-area:izq;display:flex;flex-direction:column;gap:8px}
.sv-angulos{display:flex;flex-wrap:wrap;gap:8px;touch-action:manipulation}
.sv-barra{position:relative;height:48px;max-width:560px;touch-action:none;cursor:pointer;outline:none}
.sv-barra:focus-visible{outline:3px solid #0f8a63;outline-offset:2px;border-radius:8px}
.sv-barra-pista{position:absolute;left:14px;right:14px;top:21px;height:6px;border-radius:3px;background:#d9dbe0}
.sv-barra-relleno{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#c25a00;width:50%}
.sv-barra-marcas i{position:absolute;top:-7px;width:1.5px;height:20px;margin-left:-.75px;background:#6c7280}
.sv-barra-mando{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:2.5px solid #c25a00;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sv-orden{font-size:19px;color:var(--anatomy-strong)}
.sv-orden-t{font-family:var(--anatomy-mono);font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#46464b}
.sv-orden code{font:700 19px/1.3 var(--anatomy-mono);background:#eef0ec;border:1px solid #c9cec6;border-radius:5px;padding:2px 8px;color:#1f2433}
.sv-pista{font-family:var(--anatomy-mono);font-size:14.5px;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:#46464b;margin-top:4px}
/* mandos: botones táctiles de 44 × 44 como mínimo; en el PC llevan su tecla */
.sv-mandos{display:flex;flex-wrap:wrap;gap:8px;touch-action:manipulation}
.sv-boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:44px;min-height:44px;margin:0;padding:6px 13px 6px 8px;font:600 15px/1.2 var(--anatomy-mono);letter-spacing:.03em;color:var(--anatomy-strong);background:var(--anatomy-card);border:1.5px solid var(--anatomy-strong);border-radius:7px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.sv-boton kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;font:700 12.5px/1 var(--anatomy-mono);letter-spacing:0;border:1.2px solid currentColor;border-radius:4px}
.sv-boton[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.sv-ang{min-width:76px}
.sv-ang[data-activo]{border-color:#c25a00;border-width:2.5px;color:#7a3a00;background:#fff3e6}
.sv-boton[data-principal]{border-color:#1f5fd6;border-width:2px;color:#123f99}
.sv-boton:active{transform:translateY(1px)}
.sv-boton:focus-visible{outline:3px solid #0f8a63;outline-offset:2px}
.sv-salir{position:absolute;top:10px;right:16px;z-index:2}
.sv-salir[hidden]{display:none}
@media (hover:hover) and (pointer:fine){.sv-boton:hover{background:#ececea}.sv-boton[aria-pressed="true"]:hover{background:#3a3f4d}.sv-ang[data-activo]:hover{background:#ffe9d2}}
@media (hover:none){.sv-teclas,.sv-boton kbd{display:none}.sv-boton{padding:6px 14px}}
.sv-stage:focus{outline:none}
.sv-stage:focus-visible{outline:1.5px dashed var(--anatomy-mid);outline-offset:6px}
/* leyenda y pie de figura */
.iso-figure .iso-legend{font-size:16.5px;line-height:1.55;color:#3d3d42;gap:12px}
.sv-leyenda{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.sv-ley-t{font-weight:700;color:var(--anatomy-strong)}
.sv-ley-k{display:inline-flex;align-items:center;gap:8px}
.sv-muestra{width:30px;height:20px;flex:none}
@media (max-width:760px){
  .sv-pie{grid-template-columns:minmax(0,1fr);grid-template-areas:"lectura" "osc" "izq"}
}
@media (max-width:560px){
  .sv-l{font-size:15.5px}
  .sv-estado{font-size:28px}
  .sv-pista,.sv-osc-t,.sv-angulo-t,.sv-orden-t{font-size:12.5px}
  .sv-boton{font-size:14px}
  .sv-ang{min-width:52px}
  .sv-mandos,.sv-angulos{gap:6px}
  .sv-orden,.sv-orden code{font-size:16px}
  .iso-figure .iso-legend{font-size:15px}
  .sv-plate .iso-plate-corner{font-size:11px}
  .sv-plate .iso-plate-corner[data-corner="title"]{left:0;right:0;letter-spacing:.06em;white-space:normal;line-height:1.25}
}
/* Maximizar: la tarjeta ocupa toda la pantalla (Fullscreen API) o toda la ventana;
   el dibujo toma todo el ancho que puede y la lectura pasa a un panel al lado (debajo en vertical) */
html.sv-max-abierto,html.sv-max-abierto body{overflow:hidden}
.iso-plate.sv-max{--sv-panel:clamp(320px,28vw,500px);position:fixed;inset:0;z-index:1000;width:auto;height:100vh;height:100dvh;max-width:none;margin:0;padding:46px 24px 14px;display:grid;grid-template-columns:minmax(0,calc((100vh - 60px) * 900 / 540)) var(--sv-panel);grid-template-columns:minmax(0,calc((100dvh - 60px) * 900 / 540)) var(--sv-panel);justify-content:center;grid-template-rows:minmax(0,1fr);column-gap:22px;box-shadow:none;overflow:hidden;background:var(--anatomy-card)}
.iso-plate.sv-max:fullscreen{width:100%;height:100%}
.iso-plate.sv-max:-webkit-full-screen{width:100%;height:100%}
.sv-max .iso-plate-corners{inset:16px 20px}
.sv-max .iso-plate-corner{font-size:15px}
.sv-max .iso-plate-corner[data-corner="title"]{right:auto;left:0}
.sv-max .sv-stage{grid-area:1/1;min-height:0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.sv-max .sv-stage .iso-svg{width:100%;height:100%;max-height:100%;max-width:100%;margin:0}
.sv-max .sv-pie{grid-area:1/2;display:flex;flex-direction:column;justify-content:center;gap:10px;margin:0;min-height:0;overflow:auto}
.sv-max .sv-pie{justify-content:safe center}
.sv-max .sv-pie>*{flex:none}
.sv-max .sv-oscilo{max-width:min(100%,320px)}
.sv-max .sv-l{font-size:max(19px,calc(var(--sv-panel) / 23))}
.sv-max .sv-l.sv-estado{font-size:max(38px,calc(var(--sv-panel) / 10.5));margin-bottom:6px}
.sv-max .sv-pista{font-size:14.5px}
.sv-max .sv-boton[data-mando="maximizar"]{display:none}
.sv-max .sv-nombres text{font-size:18px}
.sv-max .sv-una text{font-size:18.5px}
@media (orientation:portrait){
  .iso-plate.sv-max{grid-template-columns:minmax(0,1fr);justify-content:stretch;grid-template-rows:auto minmax(0,1fr);row-gap:12px;align-content:start}
  .sv-max .sv-stage{height:auto}
  .sv-max .sv-pie{grid-area:2/1;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);grid-template-areas:"lectura osc" "izq izq";align-items:start;gap:10px 22px;justify-content:stretch}
  .sv-max .sv-l{font-size:max(19px,min(2.3vw,26px))}
  .sv-max .sv-l.sv-estado{font-size:max(38px,min(4.6vw,52px))}
}

n" data-mando="nombres" aria-label="Ver los nombres de las piezas" aria-pressed="false" aria-keyshortcuts="N"><kbd aria-hidden="true">N</kbd><span data-texto>Ver nombres</span></button><button type="button" class="sv-boton" data-mando="maximizar" aria-label="Maximizar: ver la figura a pantalla completa" aria-pressed="false" aria-keyshortcuts="M"><kbd aria-hidden="true">M</kbd><span data-texto>Maximizar</span></button></div></div></div><button type="button" class="sv-boton sv-salir" data-mando="salir" hidden aria-label="Salir de pantalla completa" aria-keyshortcuts="Escape M"><kbd aria-hidden="true">Esc</kbd><span data-texto>Salir</span></button></div><figcaption class="iso-legend"><span class="sv-leyenda"><span class="sv-ley-t">Colores del lazo:</span><span class="sv-ley-k"><svg class="sv-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#eadff3" stroke="#7a3aa8" stroke-width="1.5"/></svg><span><b style="color:#7a3aa8">morado</b>: sensor (potenciómetro)</span></span><span class="sv-ley-k"><svg class="sv-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#d7ecdf" stroke="#1d7a4f" stroke-width="1.5"/></svg><span><b style="color:#1d7a4f">verde</b>: controlador (placa de control)</span></span><span class="sv-ley-k"><svg class="sv-muestra" viewBox="0 0 30 20" aria-hidden="true"><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="3" fill="#dbe6fa" stroke="#1f5fd6" stroke-width="1.5"/></svg><span><b style="color:#1f5fd6">azul</b>: actuador (motor y reductora)</span></span><span class="sv-ley-k"><svg class="sv-muestra" viewBox="0 0 30 20" aria-hidden="true"><path d="M5 13a10 5 0 0 0 20 0" fill="none" stroke="#1f5fd6" stroke-width="2.2"/><path d="M27.5 12.2 21.6 10.4 24.6 16.4Z" fill="#1f5fd6"/></svg><span>flecha: hacia dónde gira el motor</span></span></span><span class="iso-caption">Microservo de modelismo tipo SG90 (sin marca) con la carcasa cortada por la mitad y sin el techo de la tapa superior, para ver lo que lleva dentro. Es un sistema en lazo cerrado en miniatura: la consigna (el ángulo pedido) llega por el cable naranja como un pulso cada 20 ms cuya anchura dice el ángulo (0,544 ms para 0°, 1,472 ms para 90° y 2,400 ms para 180°, como los genera la librería Servo de Arduino). La placa de control (el controlador) compara ese ángulo con el que mide el potenciómetro (el sensor), que gira con el eje de salida, y calcula el error = ángulo pedido − ángulo medido. Si el error no es 0, hace girar el motor (el actuador) hacia el lado que lo reduce; a través de la reductora, el brazo gira despacio y con fuerza, y el motor se para cuando el error es menor de 1°. Si algo empuja el brazo, el potenciómetro lo nota y la placa vuelve a mover el motor hasta corregirlo: por eso el servo «hace fuerza para no moverse». Izquierda y derecha del motor: visto desde arriba, en sentido antihorario y horario. Números orientativos: el brazo gira unos 60° cada 0,1 s (SG90 a 5 V). Reductora ilustrativa: 4 etapas de 10 a 30 dientes, así que el motor da 81 vueltas por cada vuelta del brazo; en un SG90 real cambian el número de dientes y el tamaño de las ruedas. Todo el dibujo está a la misma escala: el servo, el trozo de shield y el conector.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

const RADIANS = Math.PI / 180;

  return [a[0] / length, a[1] / length, a[2] / length];
};
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function viewOf(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}

function lightOf(P) {
  const { sinA, cosA } = cameraOf(P);
  return unit3([-sinA, cosA, LIGHT_UP]);
}

const scaleOf = (P) => cameraOf(P).k;

function bandOf(score) {
  let tone = 0;
  while (tone < BANDS.length && score >= BANDS[tone]) tone++;
  return tone;
}

const toneOf = (normal, P) => bandOf(dot3(unit3(normal), lightOf(P)));

function frameAlong(o, a) {
  const axis = unit3(a);
  const helper = Math.abs(axis[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
  const u = unit3(cross3(helper, axis));
  const v = cross3(axis, u);
  return { o, a: axis, u, v };
}

const frameOf = (o, a, u, v) => ({ o, a, u, v });

function pointOf(F, s, r, angle) {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [
    F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]),
    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),
  ];
}

const radialOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [c * F.u[0] + n * F.v[0], c * F.u[1] + n * F.v[1], c * F.u[2] + n * F.v[2]];
};

const tangentOf = (F, angle) => {
  const c = Math.cos(angle);
  const n = Math.sin(angle);
  return [-n * F.u[0] + c * F.v[0], -n * F.u[1] + c * F.v[1], -n * F.u[2] + c * F.v[2]];
};

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {
  const sorted = [...points].sort((a, b) => a.p[0] - b.p[0] || a.p[1] - b.p[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a.p[0] - o.p[0]) * (b.p[1] - o.p[1]) - (a.p[1] - o.p[1]) * (b.p[0] - o.p[0]);
  const lower = [];
  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 1e-9) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();
    upper.push(point);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
  if (start < 0) return flags[0] ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
  const runs = [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;
  const out = [];
  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];
  }
  return out;
}

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {
  const cuts = [];
  if (Math.abs(gr) > 1e-9) {
    const visibleCut = -(ga * view.a) / (gr * view.flat);
    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }
  }
  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }
    }
  }
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];

      const cl = rect(C.u0, C.x0, C.u1, C.x1);
      // el conector: tres bocas arriba (por donde entran los cables) y la ranura del seguro en la cara de delante
      const bocas = [-11, 0, 11].map((du) => pathOf(rect(GEO.TIRA.u + du - 4.4, -4.4, GEO.TIRA.u + du + 4.4, 4.4).map(sobre(C.z1)), true)).join("");
      const seguro = pathOf([[C.u0 + 6, C.z1 - 40], [C.u1 - 6, C.z1 - 40], [C.u1 - 6, C.z1 - 22], [C.u0 + 6, C.z1 - 22]].map(([u, z]) => at(W(u, z, C.x1))), true);
      out.push({ name: "ard.conector", at: centroZ(cl, C.z0, C.z1), svg: zprism([cl], C.z0, C.z1, { tone: "mid", cls: "sv-conector", inner: `<path class="sv-boca" d="${bocas}"/><path class="sv-seguro" d="${seguro}"/>` }), shapes: () => [prZ(cl, C.z0, C.z1, { name: "ard.conector" })] });
    }
    return out;
  }

  // ======================= carcasa =======================
  function carcasa() {
    const out = [];
    const C = GEO.CASO, t = C.t;
    const u0 = C.u0, u1 = C.u1, x0 = C.x0;
    const Mq = GEO.MUESCA;
    const [zi0, zi1] = GEO.Z_INF, [zm0] = GEO.Z_MED, Cb = GEO.CUBIERTA, [zs0, zs1] = GEO.Z_SUP;
    // tapa inferior: suelo y paredes
    caja(out, "caja.suelo", rect(u0, x0, u1, 0), zi0, t, { cls: "sv-caja" });
    caja(out, "caja.inf.fondo", rect(u0, x0, u1, x0 + t), t, zi1, { cls: "sv-caja" });
    cajas(out, "caja.inf.izq", [[rect(u0, x0 + t, u0 + t, Mq.x0), t, zi1], [rect(u0, Mq.x0, u0 + t, 0), t, Mq.z0]], { cls: "sv-caja" });
    caja(out, "caja.inf.der", rect(u1 - t, x0 + t, u1, 0), t, zi1, { cls: "sv-caja" });
    // caja central: paredes, cubierta intermedia (con las muescas de los ejes) y pestañas de montaje
    caja(out, "caja.med.fondo", rect(u0, x0, u1, x0 + t), zm0, Cb.z0, { cls: "sv-caja" });
    cajas(out, "caja.med.izq", [[rect(u0, x0 + t, u0 + t, Mq.x0), zm0, Cb.z0], [rect(u0, Mq.x0, u0 + t, 0), Mq.z1, Cb.z0]], { cls: "sv-caja" });
    caja(out, "caja.med.der", rect(u1 - t, x0 + t, u1, 0), zm0, Cb.z0, { cls: "sv-caja" });
    {
      const loop = [[u0, x0], [u1, x0], [u1, 0], ...muesca(GEO.EJE_SAL, 7).reverse(), ...muesca(GEO.EJE_MOTOR, 7).reverse(), [u0, 0]];
      // la cubierta: un remache de plástico delante de cada tetón (donde se apoya la tapa superior)
      const rem = [[u0 + 30, x0 + 14], [u1 - 30, x0 + 14]].map(sobre(Cb.z1));
      out.push({ name: "caja.cubierta", at: centroZ(rect(u0, x0, u1, 0), Cb.z0, Cb.z1), svg: zprism([loop], Cb.z0, Cb.z1, { tone: "mid", cls: "sv-caja", inner: k.dotsSvg(rem, { size: 1.5, tone: "mid" }) }), shapes: () => [prZ(loop, Cb.z0, Cb.z1, { name: "caja.cubierta" })] });
    }
    const Pe = GEO.PESTANA;
    for (const [lado, ua, ub] of [["izq", u0 - Pe.largo, u0], ["der", u1, u1 + Pe.largo]]) {
      const c = (ua + ub) / 2;
      const loop = lado === "izq" ? [[ua, x0], [ub, x0], [ub, 0], ...muesca(c, Pe.agujero).reverse(), [ua, 0]] : [[ua, x0], [ub, x0], [ub, 0], ...muesca(c, Pe.agujero).reverse(), [ua, 0]];
      caja(out, `caja.pestana_${lado}`, loop, Pe.z0, Pe.z1, { cls: "sv-caja" });
    }
    // tapa superior: solo las paredes (el techo está cortado)
    caja(out, "caja.sup.fondo", rect(u0, x0, u1, x0 + t), zs0, zs1, { cls: "sv-caja" });
    caja(out, "caja.sup.izq", rect(u0, x0 + t, u0 + t, 0), zs0, zs1, { cls: "sv-caja" });
    caja(out, "caja.sup.der", rect(u1 - t, x0 + t, u1, 0), zs0, zs1, { cls: "sv-caja" });
    // los dos tetones de los tornillos de la tapa, en las esquinas de detrás; arriba, cortados, con el agujero del tornillo
    for (const [lado, cu, cx] of [["izq", u0 + t + 7, x0 + t + 7], ["der", u1 - t - 7, x0 + t + 7]]) {
      const agujero = `<path class="sv-agujero-t" d="${pathOf(circulo(cu, cx, 2.6, 16).map(sobre(zs1)), true)}"/>`;
      cilindro(out, `caja.teton_${lado}`, cu, cx, 7, zs0, zs1, { cls: "sv-caja sv-teton", inner: agujero });
    }
    return out;
  }

  // ======================= placa de control =======================
  function placa() {
    const out = [];
    const Pl = GEO.PLACA;
    const loop = rect(Pl.u0, Pl.x0, Pl.u1, Pl.x1);
    const z = Pl.z1;
    // pistas de cobre: cada una de una soldadura a otra
    const pads = {
      cables: GEO.PADS.map((p, i) => [p.u + (i - 1) * 0, p.x]),
      motor: GEO.MOTOR.bornes.map((b) => [b.u, b.x]),
      pot: GEO.POT.patas.map((p) => [p.u, p.x]),
      chip: [[GEO.CHIP.u0 - 4, GEO.CHIP.x0 + 6], [GEO.CHIP.u1 + 4, GEO.CHIP.x0 + 6]],
    };
    const pistas = [
      [pads.cables[1], [pads.cables[1][0], 30], [pads.chip[0][0], 30], pads.chip[0]],
      [pads.motor[1], [pads.motor[1][0] + 30, pads.motor[1][1]], [pads.chip[0][0], pads.chip[0][1] + 18]],
      [pads.pot[2], [pads.pot[2][0], -44], [pads.chip[1][0] + 10, -44], [pads.chip[1][0] + 10, pads.chip[1][1]], pads.chip[1]],
    ];
    const finales = [pads.chip[0], [pads.chip[0][0], pads.chip[0][1] + 18], pads.chip[1]];
    const inner = k.lineSvg(pistas.map((p) => pathOf(p.map(sobre(z)))).join(""), { tone: "mid", className: "sv-cobre" }) +
      k.dotsSvg([...pads.cables, ...pads.motor, ...pads.pot, ...finales].map(sobre(z)), { size: 2.2, tone: "mid" });
    out.push({ name: "placa.placa", at: centroZ(loop, Pl.z0, Pl.z1), svg: zprism([loop], Pl.z0, Pl.z1, { tone: "mid", cls: "sv-pcb", inner }), shapes: () => [prZ(loop, Pl.z0, Pl.z1, { name: "placa.placa" })], rol: "controlador" });
    // chip de control con sus patillas
    {
      const C = GEO.CHIP;
      const cl = rect(C.u0, C.x0, C.u1, C.x1);
      // patillas del lado que se ve, cada una sobre su soldadura (las del otro lado quedan detrás del chip)
      const pat = [], sold = [];
      for (let i = 0; i < 4; i++) {
        const x = C.x0 + 5 + i * ((C.x1 - C.x0 - 10) / 3);
        pat.push(pathOf([[C.u0, x], [C.u0 - 3.5, x]].map(sobre(Pl.z1))));
        sold.push(sobre(Pl.z1)([C.u0 - 3.5, x]));
      }
      const punto = k.dotsSvg([[C.u0 + 4, C.x1 - 4]].map(sobre(C.z1)), { size: 1.2, tone: "lo" });
      out.push({ name: "placa.chip", at: centroZ(cl, Pl.z1, C.z1), svg: zprism([cl], Pl.z1, C.z1, { tone: "mid", cls: "sv-chip", inner: punto }) + k.lineSvg(pat.join(""), { tone: "mid", className: "sv-patilla" }) + `<g class="sv-soldadura">${k.dotsSvg(sold, { size: 1.3, tone: "mid" })}</g>`, shapes: () => [prZ(cl, Pl.z1, C.z1, { name: "placa.chip" })], rol: "controlador" });
    }
    GEO.SMD.forEach((s, i) => caja(out, `placa.smd${i}`, rect(s.u0, s.x0, s.u1, s.x1), Pl.z1, Pl.z1 + s.alto, { cls: `sv-smd sv-${s.tipo}` }, { rol: "controlador" }));
    return out;
  }

  // ======================= motor =======================
  function motor() {
    const out = [];
    const Mo = GEO.MOTOR;
    const u = Mo.u;
    // lata: dos rebordes y la flecha del giro (se dibuja en la página)
    const rebordes = [Mo.z0 + 7, Mo.z1 - 7].map((z) => k.lineSvg(k.sideArc(W(u, 0, 0)[0], W(u, 0, 0)[1], Mo.r, z, P), { tone: "lo" })).join("");
    out.push({ name: "motor.lata", at: W(u, (Mo.z0 + Mo.z1) / 2, 0), svg: `<g class="sv-act sv-metal">${cil(u, 0, Mo.r, Mo.z0, Mo.z1, { inner: rebordes })}</g>`, shapes: () => [discA(u, 0, Mo.r, Mo.z0, Mo.z1, { name: "motor.lata" })], rol: "actuador" });
    cilindro(out, "motor.tapa", u, 0, Mo.tapa.r, Mo.tapa.z0, Mo.tapa.z1, { cls: "sv-plastico-negro" }, { rol: "actuador" });
    cilindro(out, "motor.cojinete", u, 0, Mo.cojinete.r, Mo.cojinete.z0, Mo.cojinete.z1, { cls: "sv-act sv-metal" }, { rol: "actuador" });
    cilindro(out, "motor.eje", u, 0, Mo.eje.r, Mo.eje.z0, GEO.RUEDA.motor.partes[0].z0, { cls: "sv-acero" }, { rol: "actuador" });
    cajas(out, "motor.bornes", Mo.bornes.map((b) => [rect(b.u - b.w / 2, b.x - b.t / 2, b.u + b.w / 2, b.x + b.t / 2), GEO.PLACA.z1, b.z1]), { cls: "sv-laton" }, { rol: "actuador" });
    return out;
  }

  // ======================= reductora =======================
  // ψ de cada parte de cada rueda con el brazo en theta
  const psiDe = (id, i, theta) => GEO.FASE[`${id}.${i}`] + M.giros(theta)[id];
  function ruedaParte(id, i, theta) {
    const R = GEO.RUEDA[id];
    const p = R.partes[i];
    const ejeR = id === "motor" ? GEO.MOTOR.eje.r : R.eje === GEO.EJE_SAL ? GEO.EJE_SALIDA.r : GEO.EJE_INTERMEDIO.r;
    const ultima = i === R.partes.length - 1;
    return Z.ruedaSvg(R.eje, p.dientes, p.z0, p.z1, psiDe(id, i, theta), { cls: "sv-rueda", eje: ultima ? ejeR : 0 });
  }
  function reductora(theta) {
    const out = [];
    const I = GEO.EJE_INTERMEDIO;
    cilindro(out, "eje_int.base", I.u, 0, 8, GEO.CUBIERTA.z1, GEO.RUEDA.r1.partes[0].z0, { cls: "sv-acero" }, { rol: "actuador" });
    cilindro(out, "eje_int.punta", I.u, 0, I.r, GEO.RUEDA.r3.partes[1].z1, I.z1, { cls: "sv-acero" }, { rol: "actuador" });
    {
      const c = GEO.RUEDA.r2.cubo;
      cilindro(out, "rueda.r2.cubo", GEO.EJE_SAL, 0, c.r, c.z0, c.z1, { cls: "sv-rueda-c" }, { rol: "actuador" });
    }
    for (const [id, R] of Object.entries(GEO.RUEDA)) {
      R.partes.forEach((p, i) => {
        const name = id === "motor" ? "motor.pinon" : `rueda.${id}.${i}`;
        const rp = GEO.rPrimitivo(p.dientes);
        out.push({ name, at: W(R.eje, (p.z0 + p.z1) / 2, 0), svg: `<g data-vivo="${name}" data-rueda="${id}" data-parte="${i}">${ruedaParte(id, i, theta)}</g>`, shapes: () => [discA(R.eje, 0, rp, p.z0, p.z1, { name })], rol: "actuador", gira: { id, i } });
      });
    }
    return out;
  }

  // ======================= potenciómetro y eje de salida =======================
  function potenciometro(theta) {
    const out = [];
    const Po = GEO.POT, u = Po.u, h = Po.base.h;
    {
      const loop = rect(u - h, -h, u + h, h);
      // pista resistiva (de carbón) y sus dos extremos; los terminales salen por detrás
      const pista = [...circulo(u, 0, Po.pista.r1, 40, Po.pista.desde, Po.pista.hasta), ...circulo(u, 0, Po.pista.r0, 40, Po.pista.hasta, Po.pista.desde)];
      const extremos = [Po.pista.desde, Po.pista.hasta].map((a) => GEO.enPlano(u, 0, (Po.pista.r0 + Po.pista.r1) / 2, a));
      const inner = `<path class="sv-pista-pot" d="${pathOf(pista.map(sobre(Po.base.z1)), true)}"/>` + k.dotsSvg(extremos.map(sobre(Po.base.z1)), { size: 1.6, tone: "hi" });
      out.push({ name: "pot.base", at: centroZ(loop, Po.base.z0, Po.base.z1), svg: zprism([loop], Po.base.z0, Po.base.z1, { tone: "mid", cls: "sv-sen sv-fenolico", inner }), shapes: () => [prZ(loop, Po.base.z0, Po.base.z1, { name: "pot.base" })], rol: "sensor" });
    }
    {
      const T = Po.tapa, t = T.t;
      const tapaL = [[u - h, -h], [u + h, -h], [u + h, 0], ...muesca(u, 7).reverse(), [u - h, 0]];
      cajas(out, "pot.tapa", [
        [rect(u - h, -h, u + h, -h + t), T.z0, T.z1 - t],
        [rect(u - h, -h + t, u - h + t, 0), T.z0, T.z1 - t],
        [rect(u + h - t, -h + t, u + h, 0), T.z0, T.z1 - t],
      ], { cls: "sv-sen sv-tapa-pot" }, { rol: "sensor" });
      // el techo de la tapa, apoyado en las paredes y por encima del cursor: otra pieza para el orden de pintado
      cajas(out, "pot.techo", [[tapaL, T.z1 - t, T.z1]], { cls: "sv-sen sv-tapa-pot" }, { rol: "sensor" });
    }
    out.push({ name: "pot.rotor", at: W(u, (Po.base.z1 + Po.rotor.z1) / 2, 0), svg: `<g data-vivo="pot.rotor">${rotorSvg(theta)}</g>`, shapes: () => rotorFormas(theta), rol: "sensor", mueve: "brazo" });
    cajas(out, "pot.patas", Po.patas.map((p) => [rect(p.u - p.w / 2, p.x - p.t / 2, p.u + p.w / 2, p.x + p.t / 2), GEO.PLACA.z1, p.z1]), { cls: "sv-laton" }, { rol: "sensor" });
    // eje de salida, en los tramos que se ven: del cursor a la cubierta, entre las ruedas y hasta el brazo
    const E = GEO.EJE_SALIDA;
    cilindro(out, "eje_sal.bajo", u, 0, E.r, Po.rotor.z1, GEO.CUBIERTA.z1, { cls: "sv-acero" }, { rol: "salida" });
    cilindro(out, "eje_sal.medio", u, 0, E.r, GEO.RUEDA.r2.partes[1].z1, GEO.RUEDA.salida.partes[0].z0, { cls: "sv-acero" }, { rol: "salida" });
    {
      // el tramo de arriba, estriado (encaja en el brazo)
      const z0 = GEO.RUEDA.salida.partes[0].z1, z1 = GEO.BRAZO.cubo.z0;
      out.push({ name: "eje_sal.alto", at: W(u, (z0 + z1) / 2, 0), svg: `<g class="sv-acero">${cil(u, 0, E.r, z0, z1)}</g>`, shapes: () => [discA(u, 0, E.r, z0, z1, { name: "eje_sal.alto" })], rol: "salida" });
    }
    return out;
  }
  // cursor del potenciómetro: cubo, disco con su marca y la lámina que roza la pista (gira con el brazo)
  const CURSOR = { r0: 8, r1: 30, ancho: 5, z0: GEO.POT.base.z1, z1: GEO.POT.base.z1 + 1.6 };
  function laminaPerfil(theta) {
    const u = GEO.POT.u;
    const a = (theta * Math.PI) / 180;
    const al = [Math.sin(a), Math.cos(a)], ac = [Math.cos(a), -Math.sin(a)];
    const pts = [[CURSOR.r0, -CURSOR.ancho / 2], [CURSOR.r1 - 2, -CURSOR.ancho / 2 + 0.8], [CURSOR.r1, 0], [CURSOR.r1 - 2, CURSOR.ancho / 2 - 0.8], [CURSOR.r0, CURSOR.ancho / 2]];
    return pts.map(([s, q]) => [u + al[0] * s + ac[0] * q, al[1] * s + ac[1] * q]);
  }
  function rotorSvg(theta) {
    const Po = GEO.POT, u = Po.u, R = Po.rotor;
    const lam = Z.prismaV(laminaPerfil(theta), CURSOR.z0, CURSOR.z1, { cls: "sv-lamina", tone: "hi" });
    const cubo = cil(u, 0, 8, Po.base.z1, R.z0, {});
    // marca del cursor (una flecha grabada) que apunta como el brazo
    const a = theta;
    const marca = [GEO.enPlano(u, 0, R.r - 3, a), GEO.enPlano(u, 0, R.r - 9, a - 14), GEO.enPlano(u, 0, R.r - 9, a + 14)].map(sobre(R.z1));
    const disco = k.solidSvg(G.disc(R.z0, R.z1, R.r, FV(u, 0), P), { tone: "mid", inner: `<path class="sv-marca" d="${pathOf(marca, true)}"/><path class="sv-ejepunta" d="${pathOf(circulo(u, 0, GEO.EJE_SALIDA.r, 20).map(sobre(R.z1)), true)}"/>` });
    return `<g class="sv-sen sv-rotor" data-angulo="${Math.round(theta * 100) / 100}">${lam}<g class="sv-sen">${cubo}${disco}</g></g>`;
  }
  const rotorFormas = (theta) => [
    A?.prism(ZF, laminaPerfil(theta), CURSOR.z0, CURSOR.z1, { name: "pot.rotor.lamina" }),
    discA(GEO.POT.u, 0, 8, GEO.POT.base.z1, GEO.POT.rotor.z0, { name: "pot.rotor.cubo" }),
    discA(GEO.POT.u, 0, GEO.POT.rotor.r, GEO.POT.rotor.z0, GEO.POT.rotor.z1, { name: "pot.rotor" }),
  ];

  // ======================= brazo =======================
  function brazoSvg(theta) {
    const B = GEO.BRAZO, u = GEO.EJE_SAL;
    const cubo = cil(u, 0, B.cubo.r, B.cubo.z0, B.cubo.z1, {});
    const ranuras = [];
    // tornillo del brazo con su ranura (gira con el brazo)
    const tor = cil(u, 0, B.tornillo.r, B.cubo.z1, B.tornillo.z1, { inner: k.lineSvg(pathOf([GEO.enPlano(u, 0, B.tornillo.r, theta + 90), GEO.enPlano(u, 0, B.tornillo.r, theta - 90)].map(sobre(B.tornillo.z1))), { tone: "hi", className: "sv-ranura-t" }) });
    void ranuras;
    return `<g class="sv-brazo-g" data-angulo="${Math.round(theta * 100) / 100}">${Z.brazoSvg(u, theta)}<g class="sv-brazo-cubo">${cubo}</g><g class="sv-acero">${tor}</g></g>`;
  }
  const brazoFormas = (theta) => {
    const B = GEO.BRAZO, u = GEO.EJE_SAL;
    return [
      A?.prism(ZF, Z.perfilBrazo(u, theta), B.z0, B.z1, { name: "brazo.brazo" }),
      discA(u, 0, B.cubo.r, B.cubo.z0, B.cubo.z1, { name: "brazo.cubo" }),
      discA(u, 0, B.tornillo.r, B.cubo.z1, B.tornillo.z1, { name: "brazo.tornillo" }),
    ];
  };
  function brazo(theta) {
    return [{ name: "brazo", at: W(GEO.EJE_SAL, GEO.BRAZO.cubo.z1, 0), svg: `<g data-vivo="brazo">${brazoSvg(theta)}</g>`, shapes: () => brazoFormas(theta), rol: "salida", mueve: "brazo" }];
  }

  // ======================= cables =======================
  // los tres cables, uno junto a otro en el plano (u, z): banda de cada cable alrededor del recorrido
  // Un cable plano: los tres hilos pegados (marrón a un lado, rojo en medio, naranja al otro); las caras
  // por donde se tocan no se dibujan.
  function cables() {
    const c = redondea(GEO.RUTA, GEO.CURVA);
    const r = GEO.CABLE.r, p = GEO.CABLE.paso;
    const clave = ([a, b]) => `${Math.round(a * 100)}|${Math.round(b * 100)}`;
    const dentro = new Set();
    const lados = (o) => banda(c, o, r);
    for (const h of [p / 2, -p / 2]) for (const q of banda(c, h, 0).slice(0, c.length)) dentro.add(clave([-q[0], q[1]]));
    const omitir = (a, b) => dentro.has(clave(a)) && dentro.has(clave(b));
    const hilos = M.CABLES.map((cab, i) => ({ cab, loop: lados((1 - i) * p) }));
    const svg = hilos.map(({ cab, loop }) => `<g data-pieza="cable_${cab.id}">${xprism([loop], -r, r, { tone: "mid", cls: `sv-cable sv-cable-${cab.id}`, omitir })}</g>`).join("");
    return [{ name: "cable", at: W(-60, 120, 0), svg, shapes: () => hilos.map(({ cab, loop }) => prX(loop, -r, r, { name: `cable.${cab.id}` })), rol: "" }];
  }

  return { mesa, carcasa, placa, motor, reductora, potenciometro, brazo, cables, ruedaParte, rotorSvg, brazoSvg, psiDe };
}

// redondea las esquinas de una polilínea (u, z) con arcos de radio r[i] en cada vértice
function redondea(pts, radios, n = 10) {
  const out = [pts[0]];

// avanza el servo dt segundos de su tiempo

    const d = empuje.hasta - medido;
    const s = Math.min(Math.abs(d), M.VEL_EMPUJON * dt);
    medido += Math.sign(d) * s;
    motor = M.motorDe(consigna, medido);

      corrigiendo = true;

// ---------- dibujo ----------
let dibujado = "";
const anillos = new Map();

    const rr = rp - 1.25 * GEO.MODULO, rt = rp + GEO.MODULO;
    const sobre = ([u, x]) => iso(W3(u, p.z1, x), P);
    anillos.set(key, pathOf(Z.circulo(R.eje, 0, rt + 0.6, 48).map(sobre), true) + pathOf(Z.circulo(R.eje, 0, rr - 0.4, 40).map(sobre).reverse(), true));

}
function flechaMotor(m) {

  // anillo con flecha alrededor de la lata, en un plano horizontal: visto desde arriba, antihorario

  const z = Mo.z1 - 16;

    const [u, x] = GEO.enPlano(Mo.u, 0, r, a);
    return iso(W3(u, z, x), P);
  });

  const tip = lista[lista.length - 1], prev = lista[lista.length - 4];
  const d = [tip[0] - prev[0], tip[1] - prev[1]];
  const l = Math.hypot(...d) || 1;

}

// ---------- lectura ----------
let dicho = "";

function say() {
  const L = LE.lineasLectura(M, { consigna, medido, motor, empujado: Boolean(empuje), corrigiendo }, { slow, still: still.matches });
  const key = L.lineas.map((l) => l.html).join("|");
  if (key !== dicho) {
    dicho = key;
    const spans = [...readout.querySelectorAll(".sv-l")];
    L.lineas.forEach((l, i) => {
      if (spans[i].innerHTML !== l.html) spans[i].innerHTML = l.html;
    });

  if (osciloDe !== consigna) {
    osciloDe = consigna;
    osciloCaja.innerHTML = LE.osciloSvg(M, consigna);
  }

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  const dts = dt / (slow ? M.LENTO : 1);

// sin animación: el brazo llega de una vez a donde va

    clearTimeout(finQuieto);

    corrigiendo = true;
    empuje = null;

  ordenEl.textContent = `barrera.write(${consigna});`;
  barra.setAttribute("aria-valuenow", String(consigna));
  barra.setAttribute("aria-valuetext", `${consigna}°`);
  const pc = `${(consigna / 180) * 100}%`;
  barra.querySelector(".sv-barra-relleno").style.width = pc;
  barra.querySelector(".sv-barra-mando").style.left = pc;
}
function alternarLento() {
  slow = !slow;
  if (status) status.textContent = slow ? `${M.LENTO} veces más despacio` : "Velocidad real";
  dicho = "";
  draw();
  run();
}

// ---------- Maximizar: pantalla completa (o la tarjeta a toda la ventana) ----------
let maxi = false;
let fsPedida = false;
let antes = null;
const fsEl = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
function ponerMax(on) {
  if (on === maxi) return;
  maxi = on;
  plate.classList.toggle("sv-max", on);
  document.documentElement.classList.toggle("sv-max-abierto", on);
  bSalir.hidden = !on;
  bMax.setAttribute("aria-pressed", String(on));
  if (status) status.textContent = on ? "Pantalla completa: pulsa Salir o Esc para volver" : "Tamaño normal";
  etiquetaDe = null;
  if (hover || pinned) mostrarUna();
}
function maximizar() {
  if (maxi) return;
  antes = { x: scrollX, y: scrollY, foco: document.activeElement };
  ponerMax(true);
  bSalir.focus({ preventScroll: true });
  const pedirFs = plate.requestFullscreen ?? plate.webkitRequestFullscreen;
  if (!pedirFs) return;
  try {
    fsPedida = true;
    const r = pedirFs.call(plate);
    if (r && r.catch) r.catch(() => (fsPedida = false));
  } catch {
    fsPedida = false;
  }
}
function salir() {
  if (!maxi) return;
  fsPedida = false;
  if (fsEl()) {
    const fuera = document.exitFullscreen ?? document.webkitExitFullscreen;
    try {
      const r = fuera?.call(document);
      if (r && r.catch) r.catch(() => {});
    } catch {}
  }
  ponerMax(false);
  if (antes) {
    const { x: sx, y: sy, foco } = antes;
    const volver = () => scrollTo(sx, sy);
    volver();
    requestAnimationFrame(volver);
    setTimeout(volver, 300);
    (foco && document.contains(foco) && foco !== bSalir && foco !== document.body ? foco : bMax).focus({ preventScroll: true });
    antes = null;
  }
}
const alCambiar = () => {
  if (fsEl() === plate) return;
  if (maxi && fsPedida) salir();
};
document.addEventListener("fullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenerror", () => (fsPedida = false));

bAng.forEach((b, i) => b.addEventListener("click", () => pedir(M.BOTONES[i])));
bEmpujar.addEventListener("click", empujar);
bLazo.addEventListener("click", () => verLazo(!lazo));
bLento.addEventListener("click", alternarLento);
bNombres.addEventListener("click", () => verTodos(!todos));
bMax.addEventListener("click", maximizar);
bSalir.addEventListener("click", salir);

const libre = (event) => !event.ctrlKey && !event.metaKey && !event.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName ?? "");
document.addEventListener("keydown", (event) => {
  if (!libre(event)) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  const i = ["0", "1", "2", "3", "4"].indexOf(key);
  if (i >= 0) {
    event.preventDefault();
    pedir(M.BOTONES[i]);
  } else if (key === "e") {
    event.preventDefault();
    empujar();
  } else if (key === "l") {
    event.preventDefault();
    verLazo(!lazo);
  } else if (key === "s") {
    event.preventDefault();
    alternarLento();
  } else if (key === "n") {
    event.preventDefault();
    verTodos(!todos);
  } else if (key === "m") {
    event.preventDefault();
    if (maxi) salir();
    else maximizar();
  } else if (key === "Escape") {
    if (pinned || hover) {
      pinned = hover = null;
      mostrarUna();
    }
    if (maxi) salir();
  }
});

// ---------- ganchos para las comprobaciones (verifica.mjs y capturas) ----------
// fija el servo: consigna y ángulo medido; avanza dt s; empuja; queda quieto (sin animación) salvo marcha
stage.__fijar = ({ consigna: c, medido: m, avanza, empujar: em } = {}) => {
  pausa = true;
  empuje = null;
  corrigiendo = false;
  if (c !== undefined) consigna = c;
  if (m !== undefined) medido = m;
  else if (c !== undefined) medido = c;
  motor = M.motorDe(consigna, medido);
  if (em) {
    empuje = { desde: medido, hasta: M.destinoEmpujon(medido) };
    if (em !== true) for (let t = 0; t < em; t += 1 / 240) paso(1 / 240);
  }
  if (avanza) for (let t = 0; t < avanza; t += 1 / 240) paso(1 / 240);
  dicho = "";
  dibujado = "";
  psiAntes = null;
  borron.clear();
  draw();
  return readout.textContent;
};
stage.__marcha = () => {
  pausa = false;
  run();
};
stage.__estado = () => ({ consigna, medido: f2(medido), motor, error: f2(M.errorDe(consigna, medido)), empuje: Boolean(empuje), corrigiendo, slow, todos, lazo, max: maxi, fs: Boolean(fsEl()), quieta: still.matches, orden: ordenEl.textContent });
stage.__anclas = () => Object.fromEntries(Object.entries(NM.anclas(ctx())).filter(([, q]) => q).map(([id, q]) => [id, iso(q, P).map(f1)]));
const queHay = (q) => {
  const a = iso(q, P);
  const c = new DOMPoint(a[0], a[1]).matrixTransform(svg.getScreenCTM());
  const hit = document.elementFromPoint(c.x, c.y);
  return hit ? piezaEn(hit) : null;
};
stage.__visibles = () => {
  const anc = NM.anclas(ctx());
  return Object.fromEntries(NM.ETIQUETAS.map((q) => q.id).filter((id) => anc[id]).map((id) => [id, queHay(anc[id])]));
};
// lo dibujado: puntos de la tapa del brazo, de la marca del cursor y de cada rueda (en el viewBox)
stage.__dibujo = () => {
  const ptsDe = (path) => (path?.getAttribute("d") ?? "").match(/-?\d+(?:\.\d+)?/g)?.map(Number) ?? [];
  const tapaBrazo = vBrazo.querySelector('.sv-brazo > path[fill-rule="evenodd"]');
  const marca = vRotor.querySelector(".sv-marca");
  const ruedas = vRuedas.map((r) => ({ id: r.id, i: r.i, psi: Number(r.g.dataset.psi), tapa: ptsDe(r.g.querySelector('.sv-gira > path[fill-rule="evenodd"]')), borron: Number(r.g.querySelector(".sv-borron")?.style.opacity ?? 0) }));
  return { brazo: ptsDe(tapaBrazo), marca: ptsDe(marca), ruedas, flecha: Number(vFlecha.dataset.sentido), flechaPath: Boolean(vFlecha.querySelector(".sv-flecha-p")), fantasma: capaFantasma.querySelector("[data-consigna]")?.dataset.consigna ?? null, oscilo: Number(osciloCaja.querySelector("svg").dataset.anchoUs), errorColor: getComputedStyle(readout.querySelector(".sv-err-v")).color, errorData: readout.querySelector(".sv-err-v").dataset.error };
};

quieta();
draw();
ponerMandos();
</script></body></html>
