<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Diagramas de bloques de un sistema en lazo abierto y de otro en lazo cerrado, con la realimentación del sensor.</title><rect width="920" height="510" fill="white"/><text x="30" y="40" font-size="20" fill="#2c6046" text-anchor="start" font-weight="bold">Lazo abierto: no comprueba el resultado</text><rect x="20" y="70" width="170" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="105.0" y="101.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Orden</text><text x="105.0" y="119.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">(pulsar, programar)</text><rect x="250" y="70" width="170" height="70" rx="10" fill="#eef5f0" stroke="#263c4a" stroke-width="2.5"/><text x="335.0" y="101.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Controlador</text><text x="335.0" y="119.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">decide</text><rect x="490" y="70" width="160" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="570.0" y="101.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Actuador</text><text x="570.0" y="119.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">hace algo</text><rect x="720" y="70" width="170" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="805.0" y="101.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Resultado</text><text x="805.0" y="119.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">(tostada, riego)</text><line x1="180" y1="105" x2="250" y2="105" stroke="#263c4a" stroke-width="2.5"/><polygon points="250,105 238.9,109.7 238.9,100.3" fill="#263c4a"/><line x1="420" y1="105" x2="490" y2="105" stroke="#263c4a" stroke-width="2.5"/><polygon points="490,105 478.9,109.7 478.9,100.3" fill="#263c4a"/><line x1="650" y1="105" x2="720" y2="105" stroke="#263c4a" stroke-width="2.5"/><polygon points="720,105 708.9,109.7 708.9,100.3" fill="#263c4a"/><text x="460" y="175" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="normal">Ejemplo: una tostadora con temporizador tuesta 2 minutos aunque el pan ya esté quemado.</text><text x="30" y="245" font-size="20" fill="#2c6046" text-anchor="start" font-weight="bold">Lazo cerrado: un sensor mide el resultado y el controlador corrige</text><rect x="30" y="275" width="150" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="105.0" y="306.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Consigna</text><text x="105.0" y="324.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">(lo que quieres)</text><rect x="250" y="275" width="170" height="70" rx="10" fill="#eef5f0" stroke="#263c4a" stroke-width="2.5"/><text x="335.0" y="306.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Controlador</text><text x="335.0" y="324.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">compara y decide</text><rect x="490" y="275" width="160" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="570.0" y="306.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Actuador</text><text x="570.0" y="324.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">calefacción</text><rect x="720" y="275" width="170" height="70" rx="10" fill="white" stroke="#263c4a" stroke-width="2.5"/><text x="805.0" y="306.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Resultado</text><text x="805.0" y="324.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">temperatura</text><line x1="180" y1="310" x2="250" y2="310" stroke="#263c4a" stroke-width="2.5"/><polygon points="250,310 238.9,314.7 238.9,305.3" fill="#263c4a"/><line x1="420" y1="310" x2="490" y2="310" stroke="#263c4a" stroke-width="2.5"/><polygon points="490,310 478.9,314.7 478.9,305.3" fill="#263c4a"/><line x1="650" y1="310" x2="720" y2="310" stroke="#263c4a" stroke-width="2.5"/><polygon points="720,310 708.9,314.7 708.9,305.3" fill="#263c4a"/><rect x="490" y="395" width="160" height="60" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2.5"/><text x="570.0" y="421.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="bold">Sensor</text><text x="570.0" y="439.25" font-size="15" fill="#263c4a" text-anchor="middle" font-weight="normal">termómetro</text><polyline points="805,345 805,425 650,425" fill="none" stroke="#d9822b" stroke-width="3" stroke-linejoin="round"/><line x1="490" y1="425" x2="335" y2="425" stroke="#d9822b" stroke-width="3"/><polygon points="335,425 346.1,420.3 346.1,429.7" fill="#d9822b"/><line x1="335" y1="425" x2="335" y2="345" stroke="#d9822b" stroke-width="3"/><polygon points="335,345 339.7,356.1 330.3,356.1" fill="#d9822b"/><text x="612" y="485" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="bold">Realimentación: el sensor mide lo mismo que el sistema está cambiando.</text></svg>