<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 691" role="img" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Tabla de pines del shield HY-M302: pulsadores en D2 y D3, DHT11 en D4, zumbador en D5, infrarrojos en D6, puertos libres D7 y D8, LED RGB en D9 rojo, D10 azul y D11 verde, LED rojo D12, LED azul D13, potenciómetro A0, LDR A1, LM35 A2 y puerto libre A3.</title><rect width="900" height="691" fill="white"/><text x="30" y="38" font-size="20" fill="#2c6046" text-anchor="start" font-weight="bold">El shield HY-M302: cada componente en su pin, siempre el mismo</text><rect x="30" y="70" width="840" height="34" fill="#2c6046"/><text x="70" y="93" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Pin</text><text x="130" y="93" font-size="16" fill="white" text-anchor="start" font-weight="bold">Componente</text><text x="560" y="93" font-size="16" fill="white" text-anchor="start" font-weight="bold">Qué da o qué hace</text><rect x="30" y="104" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="126" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D2</text><text x="130" y="126" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Pulsador SW1</text><text x="560" y="126" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">pulsado = LOW</text><rect x="30" y="136" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="158" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D3</text><text x="130" y="158" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Pulsador SW2</text><text x="560" y="158" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">pulsado = LOW</text><rect x="30" y="168" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="190" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D4</text><text x="130" y="190" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Sensor DHT11</text><text x="560" y="190" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">temperatura y humedad</text><rect x="30" y="200" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="222" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D5</text><text x="130" y="222" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Zumbador</text><text x="560" y="222" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">sonido</text><rect x="30" y="232" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="254" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D6</text><text x="130" y="254" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Receptor de infrarrojos</text><text x="560" y="254" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">mando a distancia</text><rect x="30" y="264" width="840" height="32" fill="#fff6e5" stroke="#c5dccd" stroke-width="1"/><text x="70" y="286" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D7</text><text x="130" y="286" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Puerto libre</text><text x="560" y="286" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">para servo, ultrasonidos…</text><rect x="30" y="296" width="840" height="32" fill="#fff6e5" stroke="#c5dccd" stroke-width="1"/><text x="70" y="318" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D8</text><text x="130" y="318" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Puerto libre</text><text x="560" y="318" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">para servo, ultrasonidos…</text><rect x="30" y="328" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="350" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D9</text><text x="130" y="350" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: rojo</text><text x="560" y="350" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">PWM</text><rect x="30" y="360" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="382" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D10</text><text x="130" y="382" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: azul</text><text x="560" y="382" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">PWM</text><rect x="30" y="392" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="414" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D11</text><text x="130" y="414" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LED RGB: verde</text><text x="560" y="414" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">PWM</text><rect x="30" y="424" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="446" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D12</text><text x="130" y="446" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LED rojo</text><text x="560" y="446" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">solo encendido / apagado</text><rect x="30" y="456" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="478" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">D13</text><text x="130" y="478" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LED azul (y el «L» de la placa)</text><text x="560" y="478" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">solo encendido / apagado</text><rect x="30" y="488" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="510" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A0</text><text x="130" y="510" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Potenciómetro</text><text x="560" y="510" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">0 a 1023</text><rect x="30" y="520" width="840" height="32" fill="#eef5f0" stroke="#c5dccd" stroke-width="1"/><text x="70" y="542" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A1</text><text x="130" y="542" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">LDR (luz)</text><text x="560" y="542" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">más luz → número mayor</text><rect x="30" y="552" width="840" height="32" fill="white" stroke="#c5dccd" stroke-width="1"/><text x="70" y="574" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A2</text><text x="130" y="574" font-size="16" fill="#263c4a" text-anchor="start" font-weight="normal">Sensor LM35</text><text x="560" y="574" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">temperatura</text><rect x="30" y="584" width="840" height="32" fill="#fff6e5" stroke="#c5dccd" stroke-width="1"/><text x="70" y="606" font-size="16" fill="#2c6046" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace">A3</text><text x="130" y="606" font-size="16" fill="#263c4a" text-anchor="start" font-weight="bold">Puerto libre</text><text x="560" y="606" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">analógico o digital</text><text x="30" y="646" font-size="15" fill="#d9822b" text-anchor="start" font-weight="bold">En naranja, los puertos libres: allí se enchufa lo que no trae el shield.</text><text x="30" y="670" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal">También queda libre el conector I2C (A4 y A5) para módulos.</text></svg>